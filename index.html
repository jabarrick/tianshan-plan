function dbgInternals(){ const G=produceGlobal(); const L=[];
 L.push(`year ${S.year}  trust ${r1(S.trust)}  taskHit ${r1(S.taskHit*100)}%  inflated ${r1(S.inflated)} (audit ${r0(Math.min(0.45,0.06+S.inflated/800)*100)}%)  cheated ${!!S.cheated}`);
 L.push(`coal ${r1(G.coalS)}/${r1(G.coalD)} f=${r1(G.cf*100)}%  labour ${r1(laborKept())}/${r1(laborTotal())} f=${r1(laborFactor()*100)}%  tech f=${r1(techFactor()*100)}%  mech f=${r1(mechFactor()*100)}%  cap ${r0(G.cap)} move ${moveCap()}`);
 L.push(`central in: steel ${S.in.steel} cem ${S.in.cem}  res: steel ${S.res.steel} cem ${S.res.cem}  quota ${r0(((S.flags.highQuota?0.30:D().quota)+(S.flags.debt&&S.year<=1965?0.06:0))*100)}%  fruit ${r1(fruitOut())}`);
 R.forEach(r=>{ const g=REG[r], p=produceRegion(r,1), o=S.officers[r]; L.push(`${r}: pop ${r1(g.pop)} stock ${r1(g.stock)} need ${r1(g.pop*NEED*S.ration)} grain ${r1(p.grain)} cotton ${r1(p.cotton)} water ${r1(p.w*100)}% wel ${r1(g.welfare)} crowd ${r0(g.pop/(g.cap0+lv('hous',r)*45)*100)}%  ${o?o.trait+'/'+o.flaw:''}`); });
 L.push(`next weather: ${S.dbgWx||'random'}  god: ${!!S.dbgGod}`);
 return L.join('\n'); }
function showDebug(){ if(!S.dbg){ openView(()=>({html:`<h3>${T('dbgTitle')}</h3><div class="dbgwarn">${T('dbgWarn')}</div><button class="choice" data-dg="on"><b>${T('dbgEnable')}</b></button><button class="choice" data-dg="no"><b>${T('rsNo')}</b></button>`,
  esc:()=>closeCard(), h:e=>{ const d=e.target.closest('[data-dg]'); if(!d) return false; if(d.dataset.dg==='on'){ S.dbg=true; S.cheated=true; addLog(S.year,'logDbgOn'); render(); save(); closeCard(); showDebug(); return 'closed'; } return true; }})); return; }
 openView(()=>{ const B=(id,lab,on)=>`<button class="tool${on?' on':''}" data-db="${id}">${lab}</button>`; const DL=T('dbgL');
  const evBtns=[...EVENTS.map(e=>e.year),...RANDOM.map(e=>e.id)].map(k=>`<button class="tool" data-dev="${k}">${typeof k==='number'?k+' ':''}${ev(k).ti}</button>`).join('');
  return {html:`<h3>${T('dbgTitle')}<span class="dbgchip">${T('dbgChip')}</span></h3><div class="yr">${T('dbgSub')}</div>
  <div class="dbgsec">${DL.res}</div><div class="dbggrid">${B('steel','+20 '+T('bSteel'))}${B('cem','+20 '+T('bCem'))}${B('grain',DL.grain)}${B('pop',DL.pop)}${B('trU','+20 '+T('tTrust'))}${B('trD','−20 '+T('tTrust'))}${B('weU','+20 '+T('lgWel'))}${B('weD','−20 '+T('lgWel'))}</div>
  <div class="dbgsec">${DL.time}</div><div class="dbggrid">${B('skip1',DL.skip1)}${B('skip5',DL.skip5)}</div>
  <div class="dbgsec">${DL.wx}</div><div class="dbggrid">${['','drought','good','normal'].map(w=>B('wx:'+w,DL['wx'+(w||'rand')],(S.dbgWx||'')===w)).join('')}</div>
  <div class="dbgsec">${DL.rules}</div><div class="dbggrid">${B('god',DL.god,S.dbgGod)}${B('show',DL.show,S.dbgShow)}${B('nohr',DL.nohr)}${B('cands',DL.cands)}</div>
  <div class="dbgsec">${DL.build}</div><div class="dbggrid">${B('oil',DL.oil)}${B('proj',DL.proj)}${B('all1',DL.all1)}</div>
  <div class="dbgsec">${DL.ev}</div><div class="dbggrid">${evBtns}</div>
  <div class="dbgsec">${DL.save}</div><div class="dbggrid">${B('exp',DL.exp)}${B('imp',DL.imp)}</div><textarea class="dbgta" id="dbgta" aria-label="${DL.save}"></textarea>
  <div class="dbggrid" style="margin-top:8px">${B('off',DL.off)}</div>
  <button class="btn alt sm" data-dbx="1">${T('hbOk')}</button>`,
  esc:()=>closeCard(),
  h:e=>{ if(e.target.closest('[data-dbx]')){ closeCard(); return 'closed'; }
   const evb=e.target.closest('[data-dev]'); if(evb){ const k=isNaN(+evb.dataset.dev)?evb.dataset.dev:+evb.dataset.dev; const src=typeof k==='number'?EVENTS.find(x=>x.year===k):RANDOM.find(x=>x.id===k); S.cheated=true; addLog(S.year,'logDbg',ev(k).ti); closeCard(); showEvent(k,src.fx,S.year); return 'closed'; }
   const b=e.target.closest('[data-db]'); if(!b) return false; const a=b.dataset.db;
   const act={steel:()=>{S.res.steel=r1(S.res.steel+20);},cem:()=>{S.res.cem=r1(S.res.cem+20);},grain:()=>{R.forEach(r=>REG[r].stock=Math.max(20,REG[r].pop*NEED));},pop:()=>{R.forEach(r=>REG[r].pop=r1(REG[r].pop*1.1));},
    trU:()=>{S.trust=clamp(S.trust+20,0,100);},trD:()=>{S.trust=clamp(S.trust-20,0,100);},weU:()=>{R.forEach(r=>REG[r].welfare=clamp(REG[r].welfare+20,0,100));},weD:()=>{R.forEach(r=>REG[r].welfare=clamp(REG[r].welfare-20,0,100));},
    god:()=>{S.dbgGod=!S.dbgGod;},show:()=>{S.dbgShow=!S.dbgShow;},nohr:()=>{S.hrUsed=null;},cands:()=>{S.hrC=null;},
    oil:()=>{ if(sec('oil').lock){ sec('oil').lock=0; sec('oil').lvl=Math.max(1,sec('oil').lvl); } },proj:()=>{ PROJECTS.forEach(p=>{ if(!S.flags['done_'+p.id]){ S.flags['done_'+p.id]=1; S.proj[p.id]=p.years; p.apply(); } }); },
    all1:()=>{ SECTORS.forEach(x=>{ if(x.lock&&S.year<x.lock) return; if(x.reg) R.forEach(r=>x.lvl[r]++); else x.lvl++; }); }};
   if(a.startsWith('wx:')){ dbgAct(()=>{ S.dbgWx=a.slice(3)||null; },DL['wx'+(a.slice(3)||'rand')]); refreshView(); return false; }
   if(a==='skip1'||a==='skip5'){ closeCard(); dbgSkip(a==='skip1'?1:5); return 'closed'; }
   if(a==='exp'){ $('dbgta').value=JSON.stringify({S,REG,lvl:SECTORS.map(x=>({lvl:x.lvl,lock:x.lock}))}); try{ $('dbgta').select(); navigator.clipboard&&navigator.clipboard.writeText($('dbgta').value).catch(()=>{}); }catch(err){} toast('tDbgExp'); return false; }
   if(a==='imp'){ try{ const d=JSON.parse($('dbgta').value); if(!d.S||!d.REG) throw 0; S=d.S; REG=d.REG; SECTORS.forEach((x,i)=>{ if(d.lvl&&d.lvl[i]){ x.lvl=d.lvl[i].lvl; x.lock=d.lvl[i].lock; } }); S.cheated=true; S.dbg=true; bannerKey=''; mapKey=''; render(); renderLog(); save(); toast('tDbgImp'); closeCard(); return 'closed'; }catch(err){ toast('tDbgBad'); return false; } }
   if(a==='off'){ S.dbg=false; S.dbgShow=false; S.dbgGod=false; S.dbgWx=null; render(); save(); closeCard(); return 'closed'; }
   if(act[a]){ dbgAct(act[a],b.textContent); refreshView(); } return false; }};
 }); }
function showMenu(){ openView(()=>({html:`<h3>${T('menuTitle')}</h3><div class="yr">${T('diffTag',T('diffName')[S.diff])}</div>
 <button class="choice" data-m="codex"><b>${T('codex')}</b></button><button class="choice" data-m="help"><b>${T('help')}</b></button><button class="choice" data-m="dbg"><b>${T('dbg')}${S.dbg?' ●':''}</b></button><button class="choice" data-m="restart"><b>${T('restart')}</b></button><button class="choice" data-m="close"><b>${T('hbOk')}</b></button>`,
 esc:()=>closeCard(), h:e=>{ const m=e.target.closest('[data-m]'); if(!m) return false; const k=m.dataset.m; closeCard(); if(k==='help') showHelp(); else if(k==='codex') showCodex(); else if(k==='dbg') showDebug(); else if(k==='restart') $('restart').click(); return 'closed'; }})); }
function renderLog(){ $('log').innerHTML=S.log.map(e=>{ let s=''; try{ s=T(e.k,...e.a); }catch(err){ s=''; } return `<p><b>${T('yp',e.y)}</b>${s}</p>`; }).join(''); }
function addLog(y,k,...a){ S.log.unshift({y,k,a}); if(S.log.length>300) S.log.length=300; renderLog(); }
let toastT=null; function toast(k,...a){ const el=$('toast'); if(!el) return; el.innerHTML=T(k,...a); el.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),2800); }
function applyStatic(){
 try{ document.documentElement.lang=LOC[L]; }catch(e){}
 try{ document.title=T('title'); }catch(e){}
 document.querySelectorAll('[data-t]').forEach(el=>{ el.innerHTML=T(el.dataset.t); });
 document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang===L));
}
// 弹窗以“视图函数”打开，切换语言时可重新渲染
let cardHandler=null, view=null;
const langBar=()=>`<div class="lang cardlang">${LANGS.map(l=>`<button data-lang="${l}" lang="${l}" class="${l===L?'on':''}">${({zh:'中文',en:'EN',pt:'PT'})[l]}</button>`).join('')}</div>`;
let viewEsc=null;
function openView(fn,keep){ view=fn; const v=fn(); const c=$('card'); c.innerHTML=(v.noLang?'':langBar())+v.html; $('modal').classList.add('on'); cardHandler=v.h; viewEsc=v.esc||null; if(v.after) v.after();
 if(!keep){ c.scrollTop=0; try{ const f=c.querySelector('.choice,.btn'); if(f) f.focus({preventScroll:true}); }catch(e){} } }
function refreshView(){ if(view&&$('modal').classList&&cardHandler){ const st=$('card').scrollTop; openView(view,true); $('card').scrollTop=st; } }
if(document.addEventListener) document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&viewEsc){ const f=viewEsc; f(); } });
function closeCard(){ $('modal').classList.remove('on'); cardHandler=null; view=null; viewEsc=null; }
function setLang(l){ if(!LANGS.includes(l)||l===L) return; L=l; try{ localStorage.setItem('tianshan-lang',l); }catch(e){} mapKey=''; applyStatic(); render(); renderLog(); refreshView(); }
$('card').addEventListener('click',e=>{ if(e.target.closest&&e.target.closest('[data-lang]')) return; if(!cardHandler) return; const r=cardHandler(e); if(r===true) closeCard(); });
if(document.addEventListener) document.addEventListener('click',e=>{ const b=e.target.closest&&e.target.closest('[data-lang]'); if(b) setLang(b.dataset.lang); });
function pulse(){ const s=$('stamp'); s.classList.add('pop'); setTimeout(()=>s.classList.remove('pop'),250); }
$('sectors').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
 const k=b.dataset.k, d=+b.dataset.d, s=sec(k.split(':')[0]);
 const nv=(S.invest[k]||0)+d; if(nv<0) return;
 if(d>0){ const u=used(); if(u.steel+s.cost[0]>S.res.steel+1e-9){toast('tNoSteel',s.id);return;} if(u.cem+s.cost[1]>S.res.cem+1e-9){toast('tNoCem',s.id);return;} if(u.labor+s.cost[2]*((k.split(':')[1]!=='G'&&tr(k.split(':')[1],'bureau'))?1.3:1)>laborFree()+1e-9){toast('tNoLab',s.id);return;} }
 S.invest[k]=nv; render(); });
$('regions').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
 const r=b.dataset.r, d=+b.dataset.d*4, g=REG[r], nv=S.move[r]+d;
 if(nv<0 && -nv>g.stock){ toast('tStockLow',r); return; }
 const trial={...S.move,[r]:nv}, out=R.reduce((a,x)=>a+Math.max(0,-trial[x]),0);
 if(out>moveCap()){ toast('tCapUsed',moveCap()); return; }
 S.move[r]=nv; render(); });
$('projects').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; const p=PROJECTS.find(x=>x.id===b.dataset.p); if(!p) return;
 if(S.projOn[p.id]){ delete S.projOn[p.id]; render(); return; }
 const u=used(); if(u.steel+p.cost[0]>S.res.steel+1e-9||u.cem+p.cost[1]>S.res.cem+1e-9||u.labor+p.cost[2]>laborFree()+1e-9){ toast('tProjNo',p.id); return; }
 S.projOn[p.id]=1; render(); });
$('rationSeg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; S.ration=+b.dataset.v; render(); });
$('go').addEventListener('click',execute);
$('tabbar').addEventListener('click',e=>{ const b=e.target.closest('button[data-p]'); if(b) setPane(b.dataset.p); });
$('subseg').addEventListener('click',e=>{ const b=e.target.closest('button[data-sub]'); if(b) setSub(b.dataset.sub); });
$('mmenu').addEventListener('click',showMenu);
$('hrBtn').addEventListener('click',()=>showRoster());
$('mapToggle').addEventListener('click',()=>{ mapOpen=!mapOpen; mapKey=''; render(); });
$('stats').addEventListener('click',e=>{ const t=e.target.closest('.tile'); if(t&&isPhone()){ const el=$('toast'); el.innerHTML=`<b>${t.dataset.k}</b>：${t.dataset.d}`; el.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),3200); } });
$('autoMove').addEventListener('click',autoMove); $('clearMove').addEventListener('click',()=>{ S.move={N:0,S:0,E:0}; render(); });
$('repeatInv').addEventListener('click',repeatInv); $('clearInv').addEventListener('click',()=>{ S.invest={}; S.projOn={}; render(); });
let rzT=null; if(typeof window!=='undefined'&&window.addEventListener) window.addEventListener('resize',()=>{ clearTimeout(rzT); rzT=setTimeout(()=>{ bannerKey=''; mapKey=''; drawArt(); if(view) refreshView(); },150); });
function showHelp(after){ openView(()=>({html:`<h3>${T('hbTitle')}</h3><div class="yr">${T('hbSub')}</div>${T('hb')}<button class="btn alt sm" id="hk">${T('hbOk')}</button>`,
 esc:()=>{ closeCard(); if(after) after(); },
 h:e=>{ if(e.target.id==='hk'){ closeCard(); if(after) after(); return 'closed'; } return false; }})); }
$('help').addEventListener('click',()=>showHelp());
$('codexBtn').addEventListener('click',()=>showCodex());
$('dbgBtn').addEventListener('click',()=>showDebug());
if(document.addEventListener) document.addEventListener('keydown',e=>{ if(e.ctrlKey&&e.shiftKey&&(e.key==='D'||e.key==='d')){ e.preventDefault(); showDebug(); } });
function preset1963(){
 REG.N.pop=330;REG.S.pop=330;REG.E.pop=52; REG.N.stock=14;REG.S.stock=6;REG.E.stock=2; REG.N.welfare=32;REG.S.welfare=26;REG.E.welfare=30;
 Object.assign(sec('irr').lvl,{N:4,S:3,E:2}); Object.assign(sec('farm').lvl,{N:7,S:5,E:1}); Object.assign(sec('cot').lvl,{N:1,S:4,E:0});
 Object.assign(sec('edu').lvl,{N:3,S:1,E:0}); Object.assign(sec('hous').lvl,{N:3,S:1,E:0}); Object.assign(sec('herd').lvl,{N:3,S:2,E:0});
 sec('oil').lock=0; sec('oil').lvl=4; sec('steel').lvl=2; sec('cem').lvl=2; sec('coal').lvl=3; sec('tex').lvl=2; sec('rail').lvl=5;
 S.year=1963; S.trust=30; S.flags.debt=1; S.flags.bingtuan=1; S.report='honest'; S.mach=10; S.tech=4; S.taskHit=0.7; S.scenario='short';
 S.last={oil:52,cotton:16,steel:9,cloth:8,cem:4,meat:6,coalS:12,coalD:11};
 for(let y=1953;y<1963;y++) S.hist.push({year:y,grain:150+(y-1953)*12-(y>=1959?40:0),cotton:8+(y-1953),oil:y>=1956?(y-1955)*8:0,steel:4.5,cloth:4,welfare:50-(y>=1959?14:0),trust:55,pop:480+(y-1953)*22});
}
$('restart').addEventListener('click',()=>{ openView(()=>({html:`<h3>${T('rsTitle')}</h3><p>${T('rsText')}</p><button class="choice" data-a="yes"><b>${T('rsYes')}</b></button><button class="choice" data-a="no"><b>${T('rsNo')}</b></button>`,
 esc:()=>closeCard(),
 h:e=>{ const a=e.target.closest('.choice')?.dataset.a; if(!a) return false; if(a==='yes'){ clearSave(); location.reload(); } return true; }})); });

// ================= 开局 =================
let pickedSc='full';
function newGame(){ openView(()=>({html:`<div class="lang" style="margin-bottom:8px"><button data-lang="zh" lang="zh" class="${L==='zh'?'on':''}">中文</button><button data-lang="en" lang="en" class="${L==='en'?'on':''}">English</button><button data-lang="pt" lang="pt" class="${L==='pt'?'on':''}">Português</button></div>
 <h3>${T('ngTitle')}</h3><div class="yr">${T('evYear',1953)}</div><canvas class="art" id="ngBanner" width="760" height="170" role="img" aria-label="${T('bannerAlt')}"></canvas><p>${T('ngText')}</p><p>${T('ngChoose')}</p>
 <div class="plan"><button class="choice sc ${pickedSc==='full'?'on':''}" data-sc="full"><b>${T('scFull')}</b><small>${T('scFullD')}</small></button><button class="choice sc ${pickedSc==='short'?'on':''}" data-sc="short"><b>${T('scShort')}</b><small>${T('scShortD')}</small></button></div>
 ${Object.keys(DIFF).map(k=>`<button class="choice" data-k="${k}"><b>${T('diffName')[k]}</b><small>${T('diffD')[k]}</small></button>`).join('')}`,
 noLang:true, after:()=>drawBanner('ngBanner'), h:e=>{ const sb=e.target.closest('.sc'); if(sb){ pickedSc=sb.dataset.sc; document.querySelectorAll('.sc').forEach(x=>x.classList.toggle('on',x===sb)); return false; }
  const k=e.target.closest('.choice')?.dataset.k; if(!k) return false; S.diff=k; closeCard();
  if(pickedSc==='short'){ preset1963(); addLog(1963,'logStart63',k); } else addLog(1953,'logStart',k);
  startYear(); showHelp(()=>showPlanChoice()); return 'closed'; }})); }
document.body.dataset.pane=PANE; document.body.dataset.bsub=BSUB; setSub(BSUB); document.querySelectorAll('#tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.p===PANE));
applyStatic();
if(load()){ render(); renderLog(); addLog(S.year,'logLoaded'); if(!S.planBase&&(S.year-1953)%5===0) showPlanChoice(); }
else { startYear(); newGame(); }
try{ if(location.hash==='#debug') setTimeout(showDebug,300); if(location.hash==='#codex') setTimeout(()=>showCodex(),300); }catch(e){}
</script>
</body>
