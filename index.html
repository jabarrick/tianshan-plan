<style>
:root{
  /* 1950年代自治区计委档案袋：牛皮纸、天山石青、油墨朱红、戈壁赭石、钢笔墨黑 */
  --paper:#e9dcc3; --paper-2:#f3eadb; --ink:#262420; --ink-2:#5c554a;
  --slate:#2f4a5e; --slate-2:#44687f; --red:#a8322a; --ochre:#b7793a;
  --good:#3f6b3a; --warn:#b07a1f; --bad:#a8322a; --line:#c9b791;
  --font-display:"Noto Serif SC","Songti SC","SimSun",serif;
  --font-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  /* 布局：单栏文件夹；年份章 + 全区概况 + 物资平衡表 + 定量 + 分区/调拨 + 建设安排 + 执行；年度简报弹窗 */
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
body{background-image:repeating-linear-gradient(0deg,transparent 0 23px,rgba(60,50,30,.05) 23px 24px)}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:3px double var(--slate);padding-bottom:10px;margin-bottom:14px}
h1{font-family:var(--font-display);font-weight:900;font-size:28px;margin:0;letter-spacing:.08em;color:var(--slate);text-wrap:balance}
h1 small{display:block;font-size:12px;font-weight:400;letter-spacing:.25em;color:var(--ink-2)}
.stamp{font-family:var(--font-display);border:2px solid var(--red);color:var(--red);border-radius:4px;padding:4px 10px;font-weight:600;text-align:center;line-height:1.2;transform:rotate(-3deg);min-width:92px}
.stamp b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stamp span{font-size:11px;letter-spacing:.1em}
h2{font-family:var(--font-display);font-size:16px;margin:18px 0 8px;color:var(--slate);border-left:4px solid var(--red);padding-left:8px}
h2 .hint{display:inline;margin-left:6px;font-family:var(--font-body);font-weight:400}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:640px){.stats{grid-template-columns:repeat(3,1fr)}}
@media (max-width:460px){.stats{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--paper-2);border:1px solid var(--line);padding:8px 10px;border-radius:3px}
.tile .k{font-size:11px;color:var(--ink-2);letter-spacing:.05em}
.tile .v{font-family:var(--font-display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .v small{font-size:11px;font-weight:400;color:var(--ink-2);margin-left:2px}
.tile .d{font-size:11px;color:var(--ink-2)}
.bar{height:6px;background:#d8c9a8;border-radius:3px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--slate-2)}
.bar.good i{background:var(--good)}.bar.warn i{background:var(--warn)}.bar.bad i{background:var(--bad)}
.balance{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:640px){.balance{grid-template-columns:repeat(2,1fr)}}
@media (max-width:460px){.balance{grid-template-columns:1fr}}
.bal{background:var(--slate);color:var(--paper-2);padding:8px 12px;border-radius:3px;font-variant-numeric:tabular-nums}
.bal .k{font-size:11px;letter-spacing:.1em;opacity:.85}
.bal .v{font-family:var(--font-display);font-size:22px;font-weight:600}
.bal .v small{font-size:12px;font-weight:400;opacity:.85}
.bal .d{font-size:11px;opacity:.85}
.bal.over .v{color:#ffb4a8}
table{width:100%;border-collapse:collapse;background:var(--paper-2);border:1px solid var(--line);font-size:14px}
th,td{padding:6px 7px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11px;color:var(--ink-2);font-weight:500;letter-spacing:.05em;background:#e4d6b8;white-space:nowrap}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.c{text-align:center;white-space:nowrap}
td.cost{font-size:12px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
tr.grp td{background:#e4d6b8;font-size:11px;color:var(--ink-2);padding:3px 7px;letter-spacing:.1em}
.sec{font-weight:600;white-space:nowrap}
.sec small{display:block;font-size:11px;color:var(--ink-2);font-weight:400;white-space:normal}
.ctl{display:inline-flex;align-items:center;border:1px solid var(--slate-2);border-radius:3px;overflow:hidden;background:var(--paper-2)}
.ctl button{background:transparent;border:0;width:26px;height:28px;font-size:17px;color:var(--slate);cursor:pointer;line-height:1}
.ctl button:hover{background:#dccfae}.ctl button:focus-visible,.btn:focus-visible,.choice:focus-visible,.seg button:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.ctl span{min-width:24px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;font-size:13px}
.ctl .lv{font-weight:400;color:var(--ink-2);font-size:12px;min-width:auto;padding-left:5px}
.ctl.move span{min-width:40px}
.ctl.move span.pos{color:var(--good)}.ctl.move span.neg{color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--slate-2);border-radius:3px;overflow:hidden}
.seg button{background:var(--paper-2);border:0;padding:6px 10px;font:inherit;font-size:13px;color:var(--slate);cursor:pointer;border-right:1px solid var(--slate-2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--slate);color:#fff}
.rations{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;background:var(--paper-2);border:1px solid var(--line);padding:10px 12px;border-radius:3px}
.rations .lab{font-size:13px;color:var(--ink-2);margin-right:8px}
.btn{display:block;width:100%;margin-top:14px;padding:13px;font-family:var(--font-display);font-size:18px;font-weight:600;letter-spacing:.15em;background:var(--red);color:#fff;border:0;border-radius:3px;cursor:pointer}
.btn:disabled{background:#9a8e7a;cursor:not-allowed}
.btn.alt{background:var(--slate)}
.btn.sm{font-size:14px;padding:9px;margin-top:8px;letter-spacing:.1em}
.log{background:var(--paper-2);border:1px solid var(--line);padding:10px 12px;max-height:280px;overflow:auto;font-size:13.5px}
.log p{margin:0 0 6px;padding-left:4.2em;text-indent:-4.2em}
.log p b{font-family:var(--font-display);color:var(--slate);font-variant-numeric:tabular-nums}
.log .ev{color:var(--red)}
.log .ok{color:var(--good)}
.modal{position:fixed;inset:0;background:rgba(38,36,32,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal.on{display:flex}
.card{background:var(--paper-2);max-width:540px;width:100%;max-height:92%;overflow:auto;border:1px solid var(--line);border-top:6px solid var(--red);padding:18px 20px;border-radius:3px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.card h3{font-family:var(--font-display);margin:0 0 4px;font-size:20px;color:var(--slate);text-wrap:balance}
.card .yr{font-size:12px;color:var(--ink-2);letter-spacing:.15em;margin-bottom:10px}
.card p{margin:0 0 10px}
.choice{display:block;width:100%;text-align:left;margin-top:8px;padding:10px 12px;background:var(--paper);border:1px solid var(--slate-2);border-radius:3px;cursor:pointer;font:inherit;color:var(--ink)}
.choice:hover{background:#e0d2b1}
.choice.on{background:var(--slate);color:#fff}.choice.on b,.choice.on small{color:#fff}
.choice b{display:block;color:var(--slate)}
.choice small{color:var(--ink-2)}
.plan{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
@media (max-width:460px){.plan{grid-template-columns:1fr}}
.plan .choice{margin:0}
.rep{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:14px;font-variant-numeric:tabular-nums}
.rep div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--line);padding:3px 0}
.rep .up{color:var(--good)}.rep .dn{color:var(--bad)}
.score{font-family:var(--font-display);font-size:34px;font-weight:900;color:var(--red);text-align:center;margin:10px 0}
.hint{font-size:12.5px;color:var(--ink-2);margin:6px 0 0}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:2px;background:#dccfae;color:var(--ink-2);margin-left:4px;vertical-align:middle}
.tag.red{background:var(--red);color:#fff}
.target{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:6px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.target b{color:var(--ink)}
.pill{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.pill.good{background:var(--good)}.pill.warn{background:var(--warn)}.pill.bad{background:var(--bad)}
canvas.spark{width:100%;height:120px;display:block;background:var(--paper);border:1px solid var(--line);border-radius:3px;margin:8px 0}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin-bottom:6px}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:4px}
.medals{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.medal{font-size:12px;border:1px solid var(--ochre);color:var(--ochre);padding:2px 8px;border-radius:12px}
.medal.got{background:var(--ochre);color:#fff}
.topbar{display:flex;gap:8px;justify-content:flex-end;margin-bottom:4px}
.link{background:none;border:0;color:var(--slate-2);text-decoration:underline;cursor:pointer;font:inherit;font-size:12px;padding:0}
footer{margin-top:28px;font-size:12px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:8px}
@media (prefers-reduced-motion:no-preference){.stamp{transition:transform .2s}.stamp.pop{transform:rotate(2deg) scale(1.08)}}
.lang{display:inline-flex;gap:2px;margin-right:8px}
.lang button{background:none;border:1px solid var(--line);color:var(--slate);font:inherit;font-size:12px;padding:1px 7px;border-radius:2px;cursor:pointer}
.lang button.on{background:var(--slate);color:#fff;border-color:var(--slate)}
.lang button:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.topbar{align-items:center}
.cardlang{float:right;margin:0 0 6px 10px}
.advice{background:var(--paper-2);border:1px solid var(--line);border-left:4px solid var(--ochre);padding:8px 12px;margin-top:10px;border-radius:3px;font-size:13.5px}
.advh{font-family:var(--font-display);font-weight:600;color:var(--slate);margin-bottom:4px}
.adv{padding:2px 0}.adv.l2{color:var(--bad)}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.tool{background:var(--paper-2);border:1px solid var(--slate-2);color:var(--slate);font:inherit;font-size:13px;padding:5px 10px;border-radius:3px;cursor:pointer}
.tool:hover{background:#e0d2b1}.tool:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.dock{position:sticky;bottom:0;z-index:6;margin-top:14px;background:var(--slate);color:var(--paper-2);padding:8px 10px;border-radius:3px 3px 0 0;box-shadow:0 -6px 16px rgba(0,0,0,.18);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dockres{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:rgba(255,255,255,.1);padding:3px 9px;border-radius:12px;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip small{opacity:.8;margin-right:4px}.chip.over{background:#c9584d;color:#fff}
.dockact{display:flex;align-items:center;gap:10px;margin-left:auto}
#dockWhy{font-size:12px;opacity:.9;max-width:260px}
.dock .btn{margin:0;width:auto;padding:9px 18px;font-size:16px}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-10px);background:#262420;color:#f3eadb;padding:9px 14px;border-radius:4px;font-size:13.5px;max-width:min(92vw,520px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.toast.on{opacity:1;transform:translate(-50%,0)}.toast .ev{color:#ffb4a8}.toast .ok{color:#cfe3b8}
.sec small.cin{display:none;font-variant-numeric:tabular-nums}
.sec small.eff{color:var(--slate-2);white-space:normal}
.was{color:var(--ink-2);font-weight:400}
td .up{color:var(--good)}td .dn{color:var(--bad)}
#sectors .sec{white-space:normal;min-width:190px}
#regions .rname{min-width:120px;white-space:normal}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
/* ---------- 手机单屏布局 · single-screen phone layout ---------- */
.tablewrap{overflow-x:auto;max-width:100%}
.cxcats{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 8px}
.cxcats button{background:var(--paper);border:1px solid var(--slate-2);color:var(--slate);font:inherit;font-size:12.5px;padding:3px 9px;border-radius:12px;cursor:pointer}
.cxcats button.on{background:var(--slate);color:#fff}
.cxq{width:100%;box-sizing:border-box;font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:4px;background:#fff}
.cxe{border-top:1px solid var(--line);padding:8px 0}.cxe h4{margin:0 0 3px;font-family:var(--font-display);color:var(--slate);font-size:15px}
.cxe p{margin:0;font-size:13.5px}.cxe .meta{font-size:12px;color:var(--ink-2);margin-top:3px}.cxe.lock{opacity:.55}
.cxn{font-size:12px;color:var(--ink-2);margin:4px 0}
.dbgbox{display:none;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;background:#1d2228;color:#cfe3b8;border-radius:4px;padding:8px 10px;margin:8px 0;overflow-x:auto;white-space:pre}
body.dbgShow .dbgbox{display:block}
.dbgsec{margin:10px 0 2px;font-family:var(--font-display);color:var(--slate);font-size:14px}
.dbggrid{display:flex;flex-wrap:wrap;gap:5px}.dbggrid .tool{flex:0 1 auto}
.dbggrid .tool.on{background:var(--slate);color:#fff}
.dbgta{width:100%;box-sizing:border-box;height:90px;font:11px ui-monospace,monospace;margin-top:5px}
.dbgchip{display:inline-block;background:#7a3b8c;color:#fff;font-size:11px;padding:1px 7px;border-radius:9px;margin-left:6px;vertical-align:middle}
.dbgwarn{background:#f6e7c8;border:1px solid var(--ochre);padding:8px 10px;border-radius:4px;font-size:13px}
.tg{display:inline-block;font-size:11px;padding:0 6px;border-radius:9px;margin:1px 3px 1px 0;line-height:17px;font-weight:500;white-space:nowrap;font-style:normal}
.tg.m{background:#dbe6cf;color:#2f5428}.tg.f{background:#f2d4cf;color:#8a2a22}.tg.c{background:#e4e0d4;color:#5c554a}
.off{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:8px 10px;margin-top:6px}
.off.cur{border-left:4px solid var(--slate)}
.offh{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}.offh b{font-size:15px}.offh span{font-size:12px;color:var(--ink-2)}
.offt{font-size:12.5px;margin-top:3px}.offt small{color:var(--ink-2)}
.offw{font-size:12px;color:var(--ink-2);margin-top:3px}
.off .tool{margin-top:6px;width:100%}
.hrh{font-family:var(--font-display);color:var(--slate);margin:12px 0 2px;font-size:15px}
.hrtg{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;margin:4px 0}
.hrsum{margin:10px 0 6px;font-size:13px}.hrl{padding:2px 0}
.hrgo{width:100%}
.tool.hot{border-color:var(--ochre);background:#f6e7c8}
.mhead,.tabbar,.subseg{display:none}
.gos{display:none}
.mapbtn{display:none}
@media (max-width:600px){
 html,body{height:100%;overflow:hidden;background-image:none}
 .wrap{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:0;max-width:none}

 .mchip small{opacity:.75;margin-right:3px}.mchip.bad{background:#c9584d}.mchip.warn{background:#a8792a}
 .mmenu{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;font-size:18px;width:36px;height:32px;border-radius:4px;cursor:pointer;flex:none}
 #main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:8px 10px 14px}
 .pane{display:none}
 body[data-pane="ov"] #pane-ov,body[data-pane="grain"] #pane-grain,body[data-pane="build"] #pane-build,body[data-pane="log"] #pane-log{display:block}
 h2{font-size:14px;margin:12px 0 6px}h2 .hint{display:none}
 #pane-ov h2{display:none}
 .art.banner{margin:0 0 8px}
 .advice{margin-top:0;padding:6px 10px;font-size:13px}

 .medals{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:6px 0}.medal{white-space:nowrap;font-size:11px}
 .target{font-size:12px}#reportHint{font-size:12px}
 .rations{flex-direction:column;align-items:stretch;gap:6px;padding:8px}

 .seg{display:flex}.seg button{flex:1;padding:7px 4px;font-size:12.5px}
 .cloth{font-size:12px}

 .mapbtn{display:block}
 #map{display:none}body.mapOpen #map{display:block}
 body #regions tr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px 8px;padding:7px 9px}

 body #regions td[data-l]::before{font-size:10px}
 body #regions td.rname{grid-column:1/3;font-size:15px}

 hbTitle:`计委工作手册`, hbSub:`摘要`, hbOk:`知道了`,
 hb:`<p><b>每年四件事。</b>① 定口粮定量；② 在三地间调粮，调出调入要平衡；③ 把钢材、水泥、劳动力、煤电四张平衡表安排到建设项目；④ 执行。</p>
 <p><b>水是第一约束。</b>耕地、棉田扩一分，灌溉保证率掉一分，先修水利再垦荒。南疆尤其如此。</p>
 <p><b>物资不是钱。</b>钢材主要靠中央调入，调多调少看信任和统购任务完成率；水泥、煤电可以自己建厂补上；劳动力建成后长期占用，靠住房吸纳迁入来补。</p>
 <p><b>工业是条链。</b>煤电不够，钢铁、水泥、纺织一起降开工；钢铁机械顺带产农机，农机多了耕地增产；教育卫生培养技术员，技术员不够厂矿效率低；畜牧出肉也出羊毛，羊毛进纺织。</p>
 <p><b>东疆的长处。</b>坎儿井取地下水，旱年减产只有一半；吐鲁番葡萄干、哈密瓜每年优先上调，换回信任和一点建材，也改善当地生活；兰新铁路经过哈密，调入东疆的粮食几乎没有损耗。东疆的水利投入回报最高。</p>
 <p><b>上报决定征购。</b>征购按上报数扣，不看实产；加码上报换信任，但会挤口粮，还可能被核查。五年指标按实产考核，报得越高任务越重。</p>
 <p><b>重点工程与人事。</b>跨年工程每年投一次算一年进度，停了不罚只是拖。“官员名单”里每位干部有一项长处、一项短处；每个五年计划期可以从候选干部中挑一人任命到指定地区，撤下的人不再复用。</p>
 <p><b>快捷操作。</b>“本年要点”列出最紧迫的问题；“自动调粮”按各地缺口安排调拨；“沿用上年安排”在物资允许的范围内重复上年的建设；底部执行栏随时显示物资余额。</p>
 <p><b>百科。</b>顶部“百科”（手机在 ☰ 菜单里）列出所有机制公式、部门数据、官员长短处和历史术语；遇到过的事件会收进百科。</p>
 <p><b>撤职线。</b>任一地区民生低于 8、全区民生低于 15、中央信任低于 10。</p>`,

 hbTitle:`Commission handbook`, hbSub:`Summary`, hbOk:`Got it`,
 hb:`<p><b>Four things each year.</b> ① Set the grain ration. ② Move grain between the three regions so that outgoing equals incoming. ③ Allocate the four balance sheets (steel, cement, labour, coal and power) to construction. ④ Execute.</p>
 <p><b>Water is the first constraint.</b> Every bit of new farmland or cotton lowers the irrigation guarantee, so build irrigation before reclaiming land, above all in the south.</p>
 <p><b>Materials are not money.</b> Steel comes mainly from central allocation, and how much depends on trust and quota fulfilment. Cement and power you can make up by building your own plants. Labour stays tied up once something is built, and is replenished by housing that draws in migrants.</p>
 <p><b>Industry is a chain.</b> Short of coal and power, steel, cement and textiles all slow down. Steel and machinery also turn out farm machinery, which lifts farm yields. Education and health train technicians, and without enough of them plants run inefficiently. Herding yields meat and also wool, which feeds the textile mills.</p>
 <p><b>The east's strengths.</b> Karez wells draw on groundwater, so dry years cost only half the usual harvest. Turpan raisins and Hami melons are shipped out first every year, earning trust and some building materials and improving local life. The Lanxin Railway runs through Hami, so grain sent to the east arrives almost without loss. Irrigation pays off best in the east.</p>
 <p><b>Reports set procurement.</b> Procurement is taken on reported output, not real output. Padding reports wins trust but squeezes rations and may trigger an audit. Five-year targets are judged on real output, and the higher you report, the heavier the quotas.</p>
 <p><b>Key projects and personnel.</b> Each year you fund a multi-year project counts as a year of progress; pausing costs nothing but time. In “Officials” every cadre has one strength and one weakness; once per five-year plan you may pick a candidate and appoint them to a region of your choice, and anyone you remove does not return.</p>
 <p><b>Shortcuts.</b> “This year's priorities” lists the most urgent problems; “Auto-transfer grain” arranges transfers to cover each region's shortfall; “Repeat last year's plan” repeats last year's construction as far as materials allow; the bar at the bottom always shows what is left.</p>
 <p><b>Encyclopedia.</b> “Encyclopedia” at the top (in the ☰ menu on phones) lists every formula, sector figure, official's strengths and weaknesses and historical term; events you have met are added to it.</p>
 <p><b>Dismissal lines.</b> Any region's livelihood below 8, overall livelihood below 15, or central trust below 10.</p>`,

 hb:`<p><b>Quatro coisas por ano.</b> ① Definir a ração de cereal. ② Transferir cereal entre as três regiões, com saídas iguais às entradas. ③ Afetar os quatro balanços (aço, cimento, mão de obra, carvão e energia) à construção. ④ Executar.</p>
 <p><b>A água é a primeira restrição.</b> Cada nova parcela de terra ou de algodão reduz a garantia de rega, por isso constrói a rega antes de arrotear, sobretudo no Sul.</p>
 <p><b>Os materiais não são dinheiro.</b> O aço vem sobretudo da afetação central, cuja dimensão depende da confiança e do cumprimento das quotas. O cimento e a energia podem ser compensados com fábricas próprias. A mão de obra fica ocupada depois de construir, e é reposta com habitação que atrai migrantes.</p>
 <p><b>A indústria é uma cadeia.</b> Sem carvão e energia suficientes, aço, cimento e têxteis abrandam todos. A siderurgia também produz maquinaria agrícola, que aumenta os rendimentos. A educação e saúde formam técnicos, e sem técnicos suficientes as fábricas rendem pouco. A pecuária dá carne e também lã, que alimenta os têxteis.</p>
 <p><b>Os pontos fortes do Leste.</b> Os poços karez captam água subterrânea, por isso os anos secos custam só metade da colheita habitual. As passas de Turpan e os melões de Hami são escoados primeiro todos os anos, rendendo confiança e algum material de construção e melhorando a vida local. A ferrovia Lanxin passa por Hami, por isso o cereal enviado para o Leste chega quase sem perdas. A rega compensa mais no Leste.</p>
 <p><b>As declarações fixam a requisição.</b> A requisição incide sobre a produção declarada, não a real. Inflacionar ganha confiança, mas aperta as rações e pode provocar uma auditoria. As metas quinquenais avaliam-se pela produção real, e quanto mais alto declarares, mais pesadas as quotas.</p>
 <p><b>Projetos-chave e pessoal.</b> Cada ano em que financias um projeto plurianual conta como um ano de progresso; parar só custa tempo. Em “Quadros” cada quadro tem um ponto forte e um ponto fraco; uma vez por plano quinquenal podes escolher um candidato e nomeá-lo para a região que quiseres, e quem for afastado não volta.</p>
 <p><b>Atalhos.</b> As “Prioridades do ano” listam os problemas mais urgentes; “Transferir cereal automaticamente” organiza as transferências para cobrir a falta de cada região; “Repetir o plano do ano passado” repete a construção do ano anterior na medida do possível; a barra no fundo mostra sempre o que resta.</p>
 <p><b>Enciclopédia.</b> A “Enciclopédia” no topo (no menu ☰ no telemóvel) reúne todas as fórmulas, dados dos setores, pontos fortes e fracos dos quadros e termos históricos; os eventos que encontraste ficam lá registados.</p>
 <p><b>Limites de destituição.</b> Bem-estar de qualquer região abaixo de 8, bem-estar global abaixo de 15 ou confiança do Centro abaixo de 10.</p>`,

  pt:{ti:`Criada a Região Autónoma`,tx:`A Região Autónoma Uigur de Xinjiang é formalmente criada. O Centro deposita grandes esperanças na construção da fronteira e envia um lote extra de materiais de construção.`,ch:[[`Registado`,`Confiança do Centro +5; aço +30 kt, cimento +40 kt`]]}},
 1956:{
  zh:{ti:`克拉玛依出油`,tx:`黑油山一号井喷出工业油流，克拉玛依成为新中国第一个大油田。石油部直接调入钻机与钢材，要求自治区配套道路与生活区。`,ch:[[`全力配套，列为重点`,`石油解锁，首期两座油区，交通 +1，北疆住房 +1；本年水泥 −4 万吨`],[`按常规进度配套`,`石油解锁，首期一座油区`]]},
  en:{ti:`Oil at Karamay`,tx:`Well No. 1 at Heiyoushan strikes commercial oil, and Karamay becomes New China's first large oilfield. The Ministry of Petroleum sends drilling rigs and steel directly and asks the region to provide roads and living quarters.`,ch:[[`Full support, make it a priority`,`Oil unlocked with two fields to start; transport +1, northern housing +1; cement −40 kt this year`],[`Support at the normal pace`,`Oil unlocked with one field to start`]]},
  pt:{ti:`Petróleo em Karamay`,tx:`O poço n.º 1 de Heiyoushan jorra petróleo comercial e Karamay torna-se o primeiro grande campo petrolífero da Nova China. O Ministério do Petróleo envia diretamente sondas e aço e pede à região estradas e bairros de habitação.`,ch:[[`Apoio total, como prioridade`,`Petróleo desbloqueado com dois campos iniciais; transportes +1, habitação do Norte +1; cimento −40 kt este ano`],[`Apoio ao ritmo normal`,`Petróleo desbloqueado com um campo inicial`]]}},
 1958:{
  zh:{ti:`“大跃进”`,tx:`全国掀起增产高潮，中央要求各省区粮食产量翻番，并层层上报。周边省份已报出惊人数字。你的年度上报口径将直接影响征购额。`,ch:[[`如实上报`,`中央信任 −12，征购按实产`],[`适度加码`,`上报数提高15%，征购随之上升`],[`跟进翻番`,`上报数提高40%，征购率升至30%并持续三年`]]},
  en:{ti:`The Great Leap Forward`,tx:`A nationwide drive for higher output is under way. The Centre wants every province to double grain output and report it up the chain. Neighbouring provinces have already reported astonishing figures. Your annual reporting basis will directly set the procurement quota.`,ch:[[`Report truthfully`,`Central trust −12; procurement based on real output`],[`Add a moderate margin`,`Reported figures +15%; procurement rises with them`],[`Follow the doubling`,`Reported figures +40%; procurement rate rises to 30% for three years`]]},
  pt:{ti:`O Grande Salto em Frente`,tx:`Está em curso uma campanha nacional pelo aumento da produção. O Centro exige que cada província duplique a produção de cereal e a declare pela cadeia hierárquica. As províncias vizinhas já declararam números espantosos. O teu critério de declaração anual determinará diretamente a quota de requisição.`,ch:[[`Declarar com verdade`,`Confiança do Centro −12; requisição sobre a produção real`],[`Acrescentar uma margem moderada`,`Números declarados +15%; a requisição sobe com eles`],[`Seguir a duplicação`,`Números declarados +40%; taxa de requisição sobe para 30% durante três anos`]]}},
 1959:{
  zh:{ti:`内地调粮`,tx:`多个省份出现粮荒，中央要求新疆外调粮食20万吨支援内地。粮从哪个地区出，由你决定。`,ch:[[`从北疆全额外调`,`北疆粮库 −20 万吨，中央信任 +10`],[`三地分摊外调`,`北疆 −9、南疆 −9、东疆 −2 万吨，中央信任 +10`],[`外调一半，说明困难`,`北疆粮库 −10 万吨，中央信任 −3`],[`申请免调`,`中央信任 −10`]]},
  en:{ti:`Grain for the interior`,tx:`Several provinces face grain shortages, and the Centre asks Xinjiang to send 200 kt of grain to the interior. You decide which region it comes from.`,ch:[[`All from the north`,`Northern granary −200 kt; central trust +10`],[`Split across the three regions`,`North −90 kt, south −90 kt, east −20 kt; central trust +10`],[`Send half and explain the difficulty`,`Northern granary −100 kt; central trust −3`],[`Ask for exemption`,`Central trust −10`]]},
  pt:{ti:`Cereal para o interior`,tx:`Várias províncias enfrentam escassez de cereal e o Centro pede a Xinjiang que envie 200 kt para o interior. Cabe-te decidir de que região sai.`,ch:[[`Tudo do Norte`,`Celeiro do Norte −200 kt; confiança do Centro +10`],[`Repartir pelas três regiões`,`Norte −90 kt, Sul −90 kt, Leste −20 kt; confiança do Centro +10`],[`Enviar metade e explicar as dificuldades`,`Celeiro do Norte −100 kt; confiança do Centro −3`],[`Pedir isenção`,`Confiança do Centro −10`]]}},
 1960:{
  zh:{ti:`苏联专家撤离`,tx:`中苏关系恶化，在克拉玛依、独山子和八一钢铁厂工作的苏联专家全部撤走，带走图纸，成套设备停供。`,ch:[[`组织本地技术人员顶上`,`北疆教育卫生≥3时影响较小，否则石油钢铁效率 −25%，持续三年；技术员 −30%`]]},
  en:{ti:`Soviet experts withdrawn`,tx:`As Sino-Soviet relations sour, all the Soviet experts at Karamay, Dushanzi and the Bayi Steel Works leave, taking their blueprints with them. Deliveries of complete plant equipment stop.`,ch:[[`Put local technicians in charge`,`Smaller impact if northern education & health ≥ 3; otherwise oil and steel efficiency −25% for three years; technicians −30%`]]},
  pt:{ti:`Retirada dos especialistas soviéticos`,tx:`Com a deterioração das relações sino-soviéticas, todos os especialistas soviéticos em Karamay, Dushanzi e na Siderurgia Bayi partem, levando as plantas. O fornecimento de equipamento industrial completo é suspenso.`,ch:[[`Pôr os técnicos locais à frente`,`Impacto menor se a educação e saúde do Norte ≥ 3; caso contrário, eficiência do petróleo e do aço −25% durante três anos; técnicos −30%`]]}},
 1961:{
  zh:{ti:`塔里木河断流`,tx:`上游垦区大量引水，塔里木河下游数百公里断流，南疆下游农区绝收。`,ch:[[`限制上游引水`,`南疆本年产量 −15%，此后南疆水情基数 +0.05`],[`维持上游垦区`,`南疆水情基数 −0.05，南疆民生 −10`]]},
  en:{ti:`The Tarim runs dry`,tx:`Upstream reclamation areas draw so much water that the lower Tarim River dries up for hundreds of kilometres, and downstream farmland in the south loses its entire harvest.`,ch:[[`Limit upstream withdrawals`,`Southern output −15% this year; southern base water +0.05 from then on`],[`Keep the upstream farms`,`Southern base water −0.05; southern livelihood −10`]]},
  pt:{ti:`O Tarim seca`,tx:`As zonas de arroteamento a montante captam tanta água que o curso inferior do rio Tarim seca ao longo de centenas de quilómetros, e as terras agrícolas a jusante no Sul perdem toda a colheita.`,ch:[[`Limitar as captações a montante`,`Produção do Sul −15% este ano; água base do Sul +0,05 daí em diante`],[`Manter as quintas a montante`,`Água base do Sul −0,05; bem-estar do Sul −10`]]}},
 1962:{
  zh:{ti:`兰新铁路`,tx:`兰新铁路西段铺轨至乌鲁木齐。若自治区交通建设跟得上，运力将成倍增长。南疆仍只能靠公路。`,ch:[[`全线通车`,`交通≥3：运输 +3；否则 +1，通车推迟`]]},
  en:{ti:`The Lanxin Railway`,tx:`The western section of the Lanzhou–Xinjiang Railway reaches Ürümqi. If the region's own transport keeps up, freight capacity will multiply. The south still depends on roads.`,ch:[[`Open the whole line`,`Transport ≥ 3: transport +3; otherwise +1 and the opening is delayed`]]},
  pt:{ti:`A ferrovia Lanxin`,tx:`O troço ocidental da ferrovia Lanzhou–Xinjiang chega a Urumqi. Se os transportes da própria região acompanharem, a capacidade de carga multiplicar-se-á. O Sul continua a depender das estradas.`,ch:[[`Abrir a linha completa`,`Transportes ≥ 3: transportes +3; caso contrário +1 e a abertura atrasa-se`]]}},
 1963:{
  zh:{ti:`调整时期`,tx:`中央提出“调整、巩固、充实、提高”，不再追求高指标，鼓励恢复农业。年度上报口径恢复如实。`,ch:[[`调整计划`,`口粮优先，上报如实`]]},
  en:{ti:`Readjustment`,tx:`The Centre calls to “readjust, consolidate, fill out and raise standards”. High targets are dropped and farming recovery is encouraged. Reporting returns to real figures.`,ch:[[`Readjust the plan`,`Rations first; truthful reporting`]]},
  pt:{ti:`Reajustamento`,tx:`O Centro apela a “reajustar, consolidar, completar e elevar”. Abandonam-se as metas elevadas e incentiva-se a recuperação agrícola. A declaração volta aos números reais.`,ch:[[`Reajustar o plano`,`Primeiro as rações; declaração verdadeira`]]}},
 1964:{
  zh:{ti:`支边青年到达`,tx:`首批上海、天津支边青年数万人抵疆，此后几年陆续到来。他们需要住处与口粮，也是宝贵的劳动力。`,ch:[[`安置到北疆兵团农场`,`北疆人口 +12 万；北疆住房不足 3 时民生 −8`],[`安置到南疆`,`南疆人口 +12 万；南疆住房不足 2 时民生 −8`]]},
  en:{ti:`Frontier-support youth arrive`,tx:`The first tens of thousands of young volunteers from Shanghai and Tianjin arrive, with more to follow over the next few years. They need housing and grain, and they are valuable labour.`,ch:[[`Settle them on northern Corps farms`,`Northern population +120k; northern livelihood −8 if northern housing is below 3`],[`Settle them in the south`,`Southern population +120k; southern livelihood −8 if southern housing is below 2`]]},
  pt:{ti:`Chegam os jovens de apoio à fronteira`,tx:`Chegam as primeiras dezenas de milhares de jovens voluntários de Xangai e Tianjin, e outros seguir-se-ão nos próximos anos. Precisam de habitação e de cereal, e são mão de obra valiosa.`,ch:[[`Instalá-los nas quintas do Corpo no Norte`,`População do Norte +120 mil; bem-estar do Norte −8 se a habitação do Norte for inferior a 3`],[`Instalá-los no Sul`,`População do Sul +120 mil; bem-estar do Sul −8 se a habitação do Sul for inferior a 2`]]}},
 1965:{
  zh:{ti:`南疆公路`,tx:`交通部门提出修通乌鲁木齐至喀什的干线公路，缩短南北调运时间，需要自治区从本年平衡表中挤出建材。`,ch:[[`列入计划`,`交通 +1，本年钢材 −3、水泥 −3 万吨，调拨损耗降为 3%`],[`暂缓`,`无变化`]]},
  en:{ti:`Southern highway`,tx:`The transport department proposes a trunk road from Ürümqi to Kashgar to speed up north–south grain transfers. The region must squeeze the building materials out of this year's balance sheet.`,ch:[[`Put it in the plan`,`Transport +1; steel −30 kt and cement −30 kt this year; transfer losses fall to 3%`],[`Postpone`,`No change`]]},
  pt:{ti:`Estrada do Sul`,tx:`O departamento de transportes propõe uma estrada principal de Urumqi a Kashgar para acelerar as transferências entre Norte e Sul. A região tem de tirar os materiais do balanço deste ano.`,ch:[[`Incluir no plano`,`Transportes +1; aço −30 kt e cimento −30 kt este ano; perdas nas transferências descem para 3%`],[`Adiar`,`Sem alterações`]]}},
 1966:{
  zh:{ti:`“文化大革命”开始`,tx:`运动波及自治区各机关与工厂，不少单位停产。计委内部也在争论是“抓革命”还是“促生产”。`,ch:[[`坚持生产，少开会`,`产出 −10% 持续四年；中央信任 −8`],[`随运动走`,`产出 −25% 持续四年；中央信任 +4`]]},
  en:{ti:`The Cultural Revolution begins`,tx:`The movement reaches the region's offices and factories, and many units stop work. Inside the Planning Commission there is argument over whether to “grasp revolution” or “promote production”.`,ch:[[`Keep production going, hold fewer meetings`,`Output −10% for four years; central trust −8`],[`Go with the movement`,`Output −25% for four years; central trust +4`]]},
  pt:{ti:`Começa a Revolução Cultural`,tx:`O movimento chega aos serviços e fábricas da região e muitas unidades param. Dentro da Comissão de Planeamento discute-se se se deve “agarrar a revolução” ou “promover a produção”.`,ch:[[`Manter a produção, menos reuniões`,`Produção −10% durante quatro anos; confiança do Centro −8`],[`Acompanhar o movimento`,`Produção −25% durante quatro anos; confiança do Centro +4`]]}},
 1968:{
  zh:{ti:`第三个五年计划`,tx:`在动荡中仍要上报五年指标。`,ch:[[`拟定指标`,``]]},
  en:{ti:`Third Five-Year Plan`,tx:`Even amid the turmoil, five-year targets must be reported.`,ch:[[`Draft the targets`,``]]},
  pt:{ti:`Terceiro Plano Quinquenal`,tx:`Mesmo no meio da agitação, é preciso declarar as metas quinquenais.`,ch:[[`Elaborar as metas`,``]]}},
 1970:{
  zh:{ti:`石油大会战`,tx:`石油部号召在准噶尔盆地展开勘探会战，调入钻机与人员，希望自治区配套住房与运输。`,ch:[[`响应会战`,`石油 +2，北疆住房 +1；本年水泥 −5 万吨，占用劳动力增加`],[`维持现有规模`,`无变化`]]},
  en:{ti:`Oil campaign`,tx:`The Ministry of Petroleum calls for a major exploration campaign in the Junggar Basin, sending rigs and crews, and hopes the region will provide housing and transport.`,ch:[[`Join the campaign`,`Oil +2, northern housing +1; cement −50 kt this year; more labour tied up`],[`Keep the current scale`,`No change`]]},
  pt:{ti:`Campanha do petróleo`,tx:`O Ministério do Petróleo convoca uma grande campanha de prospeção na bacia de Junggar, envia sondas e equipas e espera que a região forneça habitação e transportes.`,ch:[[`Aderir à campanha`,`Petróleo +2, habitação do Norte +1; cimento −50 kt este ano; mais mão de obra ocupada`],[`Manter a escala atual`,`Sem alterações`]]}},
 1973:{
  zh:{ti:`第四个五年计划`,tx:`生产秩序逐步恢复，重新拟定五年指标。`,ch:[[`拟定指标`,``]]},
  en:{ti:`Fourth Five-Year Plan`,tx:`Order in production is slowly being restored. New five-year targets are needed.`,ch:[[`Draft the targets`,``]]},
  pt:{ti:`Quarto Plano Quinquenal`,tx:`A ordem na produção vai sendo restabelecida. São precisas novas metas quinquenais.`,ch:[[`Elaborar as metas`,``]]}},
 1975:{
  zh:{ti:`全面整顿`,tx:`中央要求整顿企业秩序、恢复规章制度。各厂矿效率回升。`,ch:[[`落实整顿`,`产出修正恢复，效率 +10% 两年`]]},
  en:{ti:`Overall rectification`,tx:`The Centre orders enterprises to restore order and rules. Factory and mine efficiency recovers.`,ch:[[`Carry out rectification`,`Output penalties lifted; efficiency +10% for two years`]]},
  pt:{ti:`Retificação geral`,tx:`O Centro ordena às empresas que restabeleçam a ordem e as regras. A eficiência das fábricas e minas recupera.`,ch:[[`Aplicar a retificação`,`Penalizações de produção levantadas; eficiência +10% durante dois anos`]]}},

 // ---------- 随机事件 ----------
 officer:{
  zh:{ti:`专员来信`,tx:`一位地区专员来信，要求下年给本地区多拨一批水泥，并暗示否则指标难保。`,ch:[[`满足要求`,`本年水泥 −3 万吨，该地区民生 +5`],[`严词驳回`,`随机一位专员改为浮夸派`]]},
  en:{ti:`A letter from a commissioner`,tx:`A regional commissioner writes asking for an extra batch of cement next year, hinting that otherwise the targets may slip.`,ch:[[`Grant the request`,`Cement −30 kt this year; that region's livelihood +5`],[`Refuse firmly`,`A random commissioner turns Exaggerator`]]},
  pt:{ti:`Carta de um comissário`,tx:`Um comissário regional escreve a pedir um lote extra de cimento para o próximo ano, insinuando que, caso contrário, as metas podem falhar.`,ch:[[`Satisfazer o pedido`,`Cimento −30 kt este ano; bem-estar dessa região +5`],[`Recusar com firmeza`,`Um comissário ao acaso torna-se Exagerador`]]}},
 inspect:{
  zh:{ti:`自治区巡视组`,tx:`巡视组赴各地检查，发现一位专员的账目与实际出入较大。`,ch:[[`就地撤换`,`该专员调离，新人随机；累计虚报清零一半，中央信任 −3`],[`内部批评了事`,`无变化`]]},
  en:{ti:`Regional inspection team`,tx:`An inspection team touring the regions finds a commissioner whose books differ widely from reality.`,ch:[[`Replace the commissioner on the spot`,`Transferred out with a random successor; half the accumulated over-reporting written off; central trust −3`],[`Settle it with internal criticism`,`No change`]]},
  pt:{ti:`Equipa de inspeção regional`,tx:`Uma equipa de inspeção em visita às regiões encontra um comissário cujas contas diferem muito da realidade.`,ch:[[`Substituí-lo de imediato`,`Transferido, com um sucessor aleatório; metade da sobredeclaração acumulada é anulada; confiança do Centro −3`],[`Resolver com crítica interna`,`Sem alterações`]]}},
 power:{
  zh:{ti:`乌鲁木齐拉闸限电`,tx:`冬季用煤高峰，电厂存煤告急，市区工厂轮流停电。`,ch:[[`优先保工业`,`北疆民生 −6，本年煤电保障不变`],[`优先保居民`,`本年工业再减 10%`]]},
  en:{ti:`Rolling blackouts in Ürümqi`,tx:`At the winter peak the power plants run short of coal, and the city's factories take turns going without electricity.`,ch:[[`Protect industry first`,`Northern livelihood −6; this year's power supply unchanged`],[`Protect households first`,`Industry a further −10% this year`]]},
  pt:{ti:`Cortes de energia em Urumqi`,tx:`No pico do inverno as centrais ficam sem carvão e as fábricas da cidade alternam cortes de eletricidade.`,ch:[[`Proteger primeiro a indústria`,`Bem-estar do Norte −6; fornecimento de energia deste ano inalterado`],[`Proteger primeiro as casas`,`Indústria −10% adicional este ano`]]}},
 tractor:{
  zh:{ti:`东方红拖拉机到货`,tx:`一机部调拨一批拖拉机支援边疆农垦。`,ch:[[`分配到各农场`,`农机 +6 万台`]]},
  en:{ti:`Dongfanghong tractors arrive`,tx:`The First Ministry of Machine Building sends a batch of tractors to support frontier farming.`,ch:[[`Distribute them to the farms`,`Farm machinery +60k units`]]},
  pt:{ti:`Chegam tratores Dongfanghong`,tx:`O Primeiro Ministério da Construção de Máquinas envia um lote de tratores para apoiar a agricultura da fronteira.`,ch:[[`Distribuir pelas quintas`,`Maquinaria agrícola +60 mil unidades`]]}},
 breed:{
  zh:{ti:`细毛羊改良成功`,tx:`巩乃斯种羊场育成新疆细毛羊，羊毛产量和品质都有提高。`,ch:[[`推广`,`畜牧每单位羊毛产出永久提高`]]},
  en:{ti:`Fine-wool sheep bred`,tx:`The Gongnaisi stud farm breeds the Xinjiang fine-wool sheep, raising both the yield and the quality of wool.`,ch:[[`Roll it out`,`Wool output per herding unit permanently higher`]]},
  pt:{ti:`Ovelha de lã fina apurada`,tx:`A quinta de reprodução de Gongnaisi apura a ovelha de lã fina de Xinjiang, aumentando a produção e a qualidade da lã.`,ch:[[`Generalizar`,`Produção de lã por unidade pecuária permanentemente maior`]]}},
 brain:{
  zh:{ti:`内地院校毕业生分配`,tx:`高教部分配一批大学毕业生来疆。`,ch:[[`留在厂矿`,`技术员 +2 万`],[`下到农场、卫生院`,`三地民生各 +3`]]},
  en:{ti:`Graduates assigned from the interior`,tx:`The Ministry of Higher Education assigns a group of university graduates to Xinjiang.`,ch:[[`Keep them in factories and mines`,`Technicians +20k`],[`Send them to farms and clinics`,`Livelihood +3 in all three regions`]]},
  pt:{ti:`Licenciados colocados vindos do interior`,tx:`O Ministério do Ensino Superior coloca em Xinjiang um grupo de licenciados.`,ch:[[`Mantê-los nas fábricas e minas`,`Técnicos +20 mil`],[`Enviá-los para quintas e centros de saúde`,`Bem-estar +3 nas três regiões`]]}},
 karez:{
  zh:{ti:`坎儿井坍塌`,tx:`吐鲁番一批老坎儿井暗渠坍塌，数千亩葡萄园面临断水。`,ch:[[`调水泥抢修`,`本年水泥 −2 万吨，东疆水利不减`],[`任其废弃`,`东疆水利 −1`]]},
  en:{ti:`Karez collapse`,tx:`A number of old karez tunnels in Turpan cave in, and thousands of mu of vineyards face losing their water.`,ch:[[`Send cement for repairs`,`Cement −20 kt this year; eastern irrigation kept`],[`Abandon them`,`Eastern irrigation −1`]]},
  pt:{ti:`Desabamento de karez`,tx:`Vários túneis karez antigos em Turpan desabam e milhares de mu de vinha ficam sem água.`,ch:[[`Enviar cimento para reparar`,`Cimento −20 kt este ano; rega do Leste mantida`],[`Abandoná-los`,`Rega do Leste −1`]]}},
 snow:{
  zh:{ti:`伊犁牧区雪灾`,tx:`伊犁河谷遭遇数十年不遇的白灾，牲畜大批死亡，牧民断粮。`,ch:[[`从北疆粮库紧急调粮`,`北疆粮库 −5 万吨，中央信任 +3`],[`要求牧区自救`,`北疆民生 −8，北疆畜牧本年产出 −40%`]]},
  en:{ti:`Snow disaster in the Ili pastures`,tx:`The Ili valley suffers a “white disaster” unseen for decades. Livestock die in large numbers and herders run out of grain.`,ch:[[`Send emergency grain from the north`,`Northern granary −50 kt; central trust +3`],[`Tell the pastures to fend for themselves`,`Northern livelihood −8; northern herding output −40% this year`]]},
  pt:{ti:`Nevão nas pastagens de Ili`,tx:`O vale de Ili sofre um “desastre branco” como não se via há décadas. O gado morre em massa e os pastores ficam sem cereal.`,ch:[[`Enviar cereal de emergência do Norte`,`Celeiro do Norte −50 kt; confiança do Centro +3`],[`Deixar as pastagens desenrascarem-se`,`Bem-estar do Norte −8; produção pecuária do Norte −40% este ano`]]}},
 coal:{
  zh:{ti:`哈密发现大煤田`,tx:`地质队在哈密三道岭探明大型煤田，煤炭部希望自治区配套。`,ch:[[`配套开发`,`建材 +1（免耗用），东疆住房 +1，占用劳动力增加`],[`暂不开发`,`无变化`]]},
  en:{ti:`Large coalfield found at Hami`,tx:`Geologists prove a large coalfield at Sandaoling near Hami, and the Ministry of Coal wants the region to develop it.`,ch:[[`Develop it`,`Building materials +1 (no cost), eastern housing +1; more labour tied up`],[`Not yet`,`No change`]]},
  pt:{ti:`Grande jazida de carvão em Hami`,tx:`Os geólogos confirmam uma grande jazida de carvão em Sandaoling, perto de Hami, e o Ministério do Carvão quer que a região a desenvolva.`,ch:[[`Desenvolver`,`Materiais de construção +1 (sem custo), habitação do Leste +1; mais mão de obra ocupada`],[`Ainda não`,`Sem alterações`]]}},

const UN={zh:{kt:'万吨',ktyr:'万吨/年',ce:'万吨标煤',kgpp:'公斤/人',pp:'万人',mach:'万台'},

const U=k=>UN[L][k];
const mv=(x,d=1)=>ZH()?nf(x,d):nf(x*10,Math.abs(x*10)>=100?0:d);
const ms=(x,d=1)=>mv(x,d)+' '+U('kt');
const pv=x=>ZH()?nf(x,0):(Math.abs(x)>=100?nf(x/100,2):nf(x*10,0));
const pu=x=>ZH()?U('pp'):(Math.abs(x)>=100?U('pM'):U('pK'));
const pp=x=>ZH()?nf(x,0)+' 万':(Math.abs(x)>=100?nf(x/100,2)+' M':(L==='pt'?nf(x*10,0)+' mil':nf(x*10,0)+'k'));
const machV=x=>ZH()?nf(x,1):nf(x*10,0);

function T(k,...a){ const v=(STR[L]&&STR[L][k]!==undefined)?STR[L][k]:STR.zh[k]; return typeof v==='function'?v(...a):v; }
const tx=o=>o?(o[L]!==undefined?o[L]:o.zh):'';

const PAL={ink:'#2f4a5e',ink2:'#5c554a',dark:'#262420',red:'#a8322a',och:'#b7793a',grn:'#3f6b3a',leaf:'#6f8a4e',leaf2:'#8d9b5c',pap:'#f3eadb',pap2:'#e9dcc3',

const hsh=(a,b)=>{ let x=Math.imul(a+1,374761393)^Math.imul(b+7,668265263); x=Math.imul(x^(x>>>13),1274126177); return ((x^(x>>>16))>>>0)/4294967296; };
const rng=seed=>{ let t=seed>>>0; return ()=>{ t=(t+0x6D2B79F5)>>>0; let r=Math.imul(t^(t>>>15),1|t); r^=r+Math.imul(r^(r>>>7),61|r); return ((r^(r>>>14))>>>0)/4294967296; }; };
function prep(c,w,h){ if(!c||!c.getContext) return null; const ctx=c.getContext('2d'); if(!ctx) return null;
 const dpr=Math.min(2,(typeof window!=='undefined'&&window.devicePixelRatio)||1); const cw=c.clientWidth||w;
 c.width=Math.round(cw*dpr); c.height=Math.round(cw*h/w*dpr); const k=c.width/w; ctx.setTransform(k,0,0,k,0,0); ctx.lineJoin='round'; ctx.lineCap='round'; return ctx; }
function poly(c,pts,fill,stroke,lw){ c.beginPath(); pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1])); c.closePath(); if(fill){c.fillStyle=fill;c.fill();} if(stroke){c.strokeStyle=stroke;c.lineWidth=lw||1;c.stroke();} }

// ---------- 母题 · motifs ----------
function range_(c,x0,x1,base,h,seed,col,snow){ const r=rng(seed); const pts=[]; let x=x0-30; pts.push([x,base+2]);
 while(x<x1+30){ const w=24+r()*46; pts.push([x+w*(0.38+r()*0.24),base-h*(0.45+r()*0.55)]); x+=w; pts.push([x,base-h*(0.1+r()*0.28)]); }

 c.save(); c.beginPath(); pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1])); c.closePath(); c.clip();
 for(let i=1;i<pts.length-2;i+=2){ const [px,py]=pts[i],[rx,ry]=pts[i+1]; for(let k=0;k<8;k++){ const t=k/8, sx=px+(rx-px)*t, sy=py+(ry-py)*t; ln(c,sx+1,sy+1,sx+1-(base-sy)*0.22,base,'rgba(20,30,40,.2)',0.7); } }
 if(snow){ for(let i=1;i<pts.length-2;i+=2){ const [px,py]=pts[i],[lx,ly]=pts[i-1],[rx,ry]=pts[i+1]; if(base-py<h*0.6) continue; const t=0.3;
  poly(c,[[px,py],[px+(rx-px)*t,py+(ry-py)*t],[px+(rx-px)*t*0.45,py+(ry-py)*t*0.75],[px+(lx-px)*t*0.55,py+(ly-py)*t*1.05],[px+(lx-px)*t,py+(ly-py)*t]],PAL.snow); } }

function dunes(c,x0,x1,base,amp,seed){ const r=rng(seed); c.beginPath(); c.moveTo(x0,base+60); c.lineTo(x0,base); let x=x0; const cr=[];

 c.strokeStyle='rgba(150,100,40,.35)'; c.lineWidth=0.8; cr.forEach(([cx,cy])=>{ for(let k=1;k<4;k++){ c.beginPath(); c.moveTo(cx-9*k,cy+5*k); c.quadraticCurveTo(cx,cy+3*k,cx+11*k,cy+7*k); c.stroke(); } }); }
function ground(c,W,y,H,col,seed){ rect(c,0,y,W,H-y,col||PAL.ground); const r=rng(seed||3); c.fillStyle='rgba(120,90,50,.18)'; for(let i=0;i<W*(H-y)/120;i++){ c.fillRect(r()*W,y+r()*(H-y),1.2,1.2); } }
function field(c,x,y,w,h,kind){ const sk=h*0.7; const col=kind==='cot'?'#ece6d6':kind==='dry'?PAL.sand:kind==='young'?'#a3b071':PAL.leaf2;

 for(let i=1;i<7;i++){ const t=i/7; ln(c,x+w*t,y,x+w*t-sk,y+h,kind==='cot'?'rgba(92,85,74,.3)':'rgba(47,74,94,.3)',0.6); }

function poplar(c,x,y,s,bare){ ln(c,x,y,x,y-6*s,PAL.ink2,1.1*s);

 c.beginPath(); c.ellipse(x,y-17*s,3.6*s,12*s,0,0,Math.PI*2); c.fillStyle=PAL.grn; c.fill();

 for(let k=1;k<5;k++){ const t=k/5, yy=y-32*s*t, hw=7*s*(1-t)+1.2*s*t, yn=y-32*s*(t-0.2), hn=7*s*(1-t+0.2)+1.2*s*(t-0.2); ln(c,x-hw,yy,x+hw,yy,col,0.8*s); ln(c,x-hn,yn,x+hw,yy,col,0.6*s); }

 cadre:(c,W,H)=>{ base(c,W,H,{peaks:1,gy:100}); field(c,40,110,200,18,'young'); for(let i=0;i<6;i++) person(c,260+i*30,146,1,i%2?'bundle':'hoe'); },
 wool:(c,W,H)=>{ base(c,W,H,{peaks:1,gy:104,sun:1}); for(let i=0;i<6;i++) sheep(c,40+i*30,136+hsh(i,2)*8,1.2); factory(c,360,132,1.5,true); },
};
function drawVignette(id,key){ const c=$(id); const W=480,H=150; const x=prep(c,W,H); if(!x) return; const f=SCN[key]; if(!f){ base(x,W,H,{peaks:1,gy:100}); } else f(x,W,H); paperGrain(x,W,H,13); rect(x,0.5,0.5,W-1,H-1,null,'rgba(47,74,94,.45)',1); }

// ================= 百科 · Encyclopedia · Enciclopédia =================
// 机制条目与术语条目；部门、工程、人事、事件、荣誉条目由游戏数据生成
const CODEX={
 mech:[
  {k:'water',
   zh:{t:'水与灌溉保证率',b:'各地灌溉保证率 = 基础水情 + 水利 × 9 个百分点 − （耕地 + 棉田）× 地区耗水。北疆耗水 1.4、南疆 2.0、东疆 2.4 个百分点。保证率乘到粮棉产量上，低于 80% 标“缺水”，下限 40%、上限 125%。所以先修水利再垦荒，南疆、东疆尤其如此。'},
   en:{t:'Water and the irrigation guarantee',b:'Each region\'s irrigation guarantee = base water + irrigation × 9 points − (farmland + cotton) × regional water use. Water use per unit is 1.4 points in the north, 2.0 in the south and 2.4 in the east. The guarantee multiplies grain and cotton output; below 80% the region is marked short of water, with a floor of 40% and a ceiling of 125%. Build irrigation before reclaiming land, above all in the south and east.'},
   pt:{t:'Água e garantia de rega',b:'A garantia de rega de cada região = água base + rega × 9 pontos − (terras + algodão) × consumo regional. O consumo por unidade é de 1,4 pontos no Norte, 2,0 no Sul e 2,4 no Leste. A garantia multiplica a produção de cereal e algodão; abaixo de 80% a região fica marcada com falta de água, com mínimo de 40% e máximo de 125%. Constrói rega antes de arrotear, sobretudo no Sul e no Leste.'}},
  {k:'grain',
   zh:{t:'口粮、征购与调拨',b:'标准定量每人每年 230 公斤原粮。征购 = 上报产量 × 征购率（历史难度 20%），按各地实产比例摊派。地区粮库 + 实产 − 征购不足以发放定量时，按比例减发，民生与人口随之受损；全区缺粮人口越多，中央信任扣得越多。粮库满仓后的余粮自动超购上调，可换回少量信任。调拨有损耗：一般 6%，修通南疆公路后 3%，调入东疆 2%。'},
   en:{t:'Rations, procurement and transfers',b:'The standard ration is 230 kg of unhusked grain per person per year. Procurement = reported output × procurement rate (20% on Historical), shared out in proportion to each region\'s real output. If granary + output − procurement cannot cover the ration, rations are cut pro rata and livelihood and population suffer; the more people go short across the region, the more central trust you lose. Once granaries are full, the surplus is bought up automatically for a little trust. Transfers lose grain: 6% normally, 3% once the southern highway is built, 2% into the east.'},
   pt:{t:'Rações, requisição e transferências',b:'A ração padrão é de 230 kg de cereal por pessoa e por ano. Requisição = produção declarada × taxa de requisição (20% na dificuldade Histórica), repartida em proporção da produção real de cada região. Se celeiro + produção − requisição não chegar para a ração, esta é reduzida proporcionalmente e o bem-estar e a população sofrem; quanto mais gente fica sem cereal, mais confiança do Centro perdes. Com os celeiros cheios, o excedente é comprado automaticamente em troca de alguma confiança. As transferências perdem cereal: 6% em geral, 3% depois da estrada do Sul, 2% para o Leste.'}},
  {k:'report',
   zh:{t:'上报口径与核查',b:'征购按上报数计算，不看实产。加码 15% 或翻番 40% 能换来信任，但会挤占口粮，差额计入“累计虚报”。每年被中央工作组核查的概率约为 6% + 累计虚报 ÷ 800 万吨（上限 45%），一旦查出，扣信任 8 + 累计虚报 ÷ 12（上限 35），累计虚报清零。好大喜功的专员会在你如实上报时也多报一成。'},
   en:{t:'Reporting basis and audits',b:'Procurement is based on reported, not real, output. A 15% margin or 40% doubling wins trust but squeezes rations, and the difference is added to accumulated over-reporting. Each year the chance of a central audit is about 6% + accumulated over-reporting ÷ 8 Mt (capped at 45%); if caught, you lose 8 + over-reporting ÷ 120 kt in trust (capped at 35) and the tally resets. A boastful commissioner adds 10% even when you report truthfully.'},
   pt:{t:'Critério de declaração e auditorias',b:'A requisição baseia-se na produção declarada, não na real. Uma margem de 15% ou a duplicação de 40% ganham confiança, mas apertam as rações, e a diferença soma-se à sobredeclaração acumulada. Todos os anos a probabilidade de auditoria central é de cerca de 6% + sobredeclaração acumulada ÷ 8 Mt (máximo 45%); se fores apanhado, perdes 8 + sobredeclaração ÷ 120 kt de confiança (máximo 35) e o total volta a zero. Um comissário fanfarrão acrescenta 10% mesmo quando declaras a verdade.'}},
  {k:'mat',
   zh:{t:'钢材、水泥与中央调入',b:'每年钢材来源 = 中央调入 + 区内钢产 × 80% + 上年结余；水泥 = 中央调入 + 区内产量 + 上年结余。中央调入钢材 ≈（4 + 信任 × 0.06）×（0.75 + 0.45 × 上年统购完成率）× 难度系数，水泥类似。未用完的一半转入下年（钢材最多 10 万吨、水泥最多 15 万吨）。东疆瓜果上调也会换回少量建材。'},
   en:{t:'Steel, cement and central allocation',b:'Each year steel = central allocation + 80% of regional steel output + carry-over; cement = central allocation + regional output + carry-over. Central steel ≈ (4 + trust × 0.06) × (0.75 + 0.45 × last year\'s quota fulfilment) × difficulty factor (×10 kt), and cement works similarly. Half of what is unused carries over (up to 100 kt of steel and 150 kt of cement). Fruit shipped from the east also brings back a little building material.'},
   pt:{t:'Aço, cimento e afetação central',b:'Todos os anos, aço = afetação central + 80% da produção regional de aço + transição; cimento = afetação central + produção regional + transição. O aço central ≈ (4 + confiança × 0,06) × (0,75 + 0,45 × cumprimento da quota do ano anterior) × fator de dificuldade (×10 kt), e o cimento é semelhante. Metade do que não for usado transita (até 100 kt de aço e 150 kt de cimento). As frutas enviadas do Leste também trazem algum material de construção.'}},
  {k:'labor',
   zh:{t:'劳动力',b:'劳动力总量 = 人口 × 42%。每处设施建成后长期占用劳动力（建设表每行标明），本年建设还要额外用工。各业长期占用超过总量时，所有行业按比例降低开工率（最低 60%）。补充劳动力靠住房：住房吸引迁入，民生高于 55 时迁入更多；住房不足会拥挤，压低民生。'},
   en:{t:'Labour',b:'Total labour = population × 42%. Every facility keeps tying up labour once built (each construction row shows how much), and this year\'s building needs extra labour on top. If facilities tie up more than the total, every sector runs at a reduced rate (down to 60%). Labour is replenished through housing: housing attracts migrants, more of them when livelihood is above 55; too little housing means crowding, which lowers livelihood.'},
   pt:{t:'Mão de obra',b:'Mão de obra total = população × 42%. Cada instalação continua a ocupar mão de obra depois de construída (cada linha de construção indica quanto), e a construção do ano exige mão de obra adicional. Se as instalações ocuparem mais do que o total, todos os setores funcionam a ritmo reduzido (até 60%). A mão de obra repõe-se com habitação: a habitação atrai migrantes, mais ainda com bem-estar acima de 55; habitação insuficiente provoca sobrelotação, que baixa o bem-estar.'}},
  {k:'chain',
   zh:{t:'工业链：煤电、技术员、农机',b:'钢铁、水泥、纺织、石油和城镇都要用煤，煤电供给不足时钢铁、水泥、纺织按比例减产（最低 50%）。厂矿越多需要的技术员越多，技术员不足时效率最低降到 75%，教育卫生每年培养技术员，苏联专家撤离会带走三成。钢铁机械每年产农机，农机保有量相对耕地越高，粮食最多增产 25%，农机每年折旧 6%。'},
   en:{t:'Industrial chain: power, technicians, machinery',b:'Steel, cement, textiles, oil and towns all burn coal; when coal and power fall short, steel, cement and textiles scale down (to no less than 50%). More plants need more technicians, and without enough of them efficiency can drop to 75%; education & health train technicians every year, and the Soviet withdrawal takes away 30% of them. Steel & machinery turns out farm machinery each year; the more machinery relative to farmland, the higher grain yields, up to +25%; machinery depreciates 6% a year.'},
   pt:{t:'Cadeia industrial: energia, técnicos, maquinaria',b:'Aço, cimento, têxteis, petróleo e cidades consomem carvão; quando falta carvão e energia, aço, cimento e têxteis reduzem a produção (até um mínimo de 50%). Mais fábricas exigem mais técnicos e, se faltarem, a eficiência pode cair para 75%; a educação e saúde formam técnicos todos os anos, e a retirada soviética leva 30% deles. A siderurgia produz maquinaria agrícola todos os anos; quanto mais maquinaria em relação às terras, maior o rendimento do cereal, até +25%; a maquinaria deprecia 6% ao ano.'}},
  {k:'welfare',
   zh:{t:'民生',b:'各地民生每年向目标值靠拢 35%。目标值以口粮为主（足额约 +42，宽裕再加，减发时急剧下降），再加上布票、肉食、住房和教育卫生的加分（口粮不足时这些加分也打折），减去拥挤、动荡和专员短处的扣分。民生过低会让农民出工不出力，粮食最多减产 15%。任一地区低于 8 或全区低于 15 就会被撤职。'},
   en:{t:'Livelihood',b:'Each year a region\'s livelihood moves 35% of the way towards a target. The target is driven mainly by rations (about +42 for a full ration, more if generous, falling sharply when rations are cut), plus points for cloth, meat, housing and education & health (which shrink when rations are short), minus crowding, unrest and commissioners\' weaknesses. Low livelihood means farmers work half-heartedly, cutting grain by up to 15%. Any region below 8, or the whole region below 15, means dismissal.'},
   pt:{t:'Bem-estar',b:'Todos os anos o bem-estar de cada região aproxima-se 35% de um valor-alvo. O alvo depende sobretudo das rações (cerca de +42 com ração completa, mais se generosa, caindo a pique quando há cortes), mais pontos por tecido, carne, habitação e educação e saúde (que encolhem quando falta cereal), menos sobrelotação, agitação e fraquezas dos comissários. Bem-estar baixo faz os camponeses trabalharem sem vontade, cortando até 15% do cereal. Qualquer região abaixo de 8, ou a média abaixo de 15, significa destituição.'}},
  {k:'trust',
   zh:{t:'中央信任',b:'加分来源：完成统购任务（+2.5 左右）、余粮超购、瓜果上调、加码上报、五年计划全面完成、重点工程竣工和部分事件。扣分来源：每年自然衰减（历史 −1、严酷 −2）、缺粮、统购完成率低于 80%、核查查出虚报、五年计划未完成、任免专员（−2）。信任越高，加分的边际效果越小。低于 10 被免职。'},
   en:{t:'Central trust',b:'Gains: meeting state quotas (about +2.5), surplus procurement, fruit shipments, padded reports, fulfilling a five-year plan, finishing key projects and some events. Losses: yearly decay (−1 on Historical, −2 on Harsh), grain shortages, quota fulfilment below 80%, audits that uncover over-reporting, missed five-year targets and appointing a commissioner (−2). The higher your trust, the smaller each gain. Below 10 you are removed.'},
   pt:{t:'Confiança do Centro',b:'Ganhos: cumprir as quotas estatais (cerca de +2,5), compra de excedentes, envio de frutas, declarações inflacionadas, cumprir um plano quinquenal, concluir projetos-chave e alguns eventos. Perdas: decaimento anual (−1 na Histórica, −2 na Severa), falta de cereal, cumprimento das quotas abaixo de 80%, auditorias que descobrem sobredeclaração, metas quinquenais falhadas e nomear um comissário (−2). Quanto mais alta a confiança, menor cada ganho. Abaixo de 10 és afastado.'}},
  {k:'score',
   zh:{t:'终评得分',b:'得分 = 人口 × 0.25 + 全区民生 × 2 + 中央信任 + 工业实物量指数 × 0.6 + 粮食自给率 × 120 − 地区民生差距 × 0.8 + 荣誉 × 15，账目干净 +20、有过虚报 −30。再乘难度系数（平稳 0.85、严酷 1.25）和剧本系数（调整起步 0.85）。中途免职得分减半且不计难度系数；使用过调试模式的局会标为“调试局”。'},
   en:{t:'Final score',b:'Score = population (10k) × 0.25 + livelihood × 2 + central trust + industrial index × 0.6 + grain self-sufficiency × 120 − regional livelihood gap × 0.8 + 15 per honour, +20 for clean books or −30 if you ever over-reported. It is then multiplied by difficulty (Gentle 0.85, Harsh 1.25) and scenario (Readjustment start 0.85). Removal from office halves the score with no difficulty bonus; games that used debug mode are marked as debug games.'},
   pt:{t:'Pontuação final',b:'Pontuação = população (dezenas de milhar) × 0,25 + bem-estar × 2 + confiança do Centro + índice industrial × 0,6 + autossuficiência cerealífera × 120 − diferença de bem-estar entre regiões × 0,8 + 15 por distinção, +20 com contas limpas ou −30 se alguma vez sobredeclaraste. Depois multiplica-se pela dificuldade (Suave 0,85, Severa 1,25) e pelo cenário (início no Reajustamento 0,85). O afastamento reduz a pontuação a metade, sem bónus de dificuldade; os jogos com modo de depuração ficam marcados como jogos de depuração.'}},
 ],
 gloss:[
  {k:'tonggou',
   zh:{t:'统购统销',b:'1953 年底起实行的粮食计划收购与计划供应制度：农民按国家规定的价格和数量交售余粮，城镇居民凭证定量购买。此后棉花、油料等也陆续纳入。游戏里的“征购”与“定量供应”即由此而来。'},
   en:{t:'State monopoly of purchase and sale',b:'From late 1953, grain was bought from farmers at state-set prices and quotas and sold to urban residents in fixed rations against coupons. Cotton, oil crops and other goods were added later. The game\'s procurement and rationing come from this system.'},
   pt:{t:'Monopólio estatal de compra e venda',b:'A partir do fim de 1953, o cereal passou a ser comprado aos camponeses a preços e quotas fixados pelo Estado e vendido aos habitantes das cidades em rações fixas, mediante senhas. Mais tarde juntaram-se o algodão, as oleaginosas e outros bens. A requisição e o racionamento do jogo vêm deste sistema.'}},
  {k:'piao',
   zh:{t:'粮票与布票',b:'定量供应的凭证。粮票按人发放，布票自 1954 年起在全国推行，每人每年的布匹定量随产量浮动。票证制度一直延续到 1990 年代初才逐步取消。'},
   en:{t:'Grain and cloth coupons',b:'Ration coupons. Grain coupons were issued per person; cloth coupons were introduced nationwide from 1954, with each person\'s yearly cloth ration rising and falling with output. The coupon system was only phased out in the early 1990s.'},
   pt:{t:'Senhas de cereal e de tecido',b:'Senhas de racionamento. As senhas de cereal eram atribuídas por pessoa; as de tecido foram introduzidas em todo o país a partir de 1954, e a ração anual de cada pessoa variava com a produção. O sistema de senhas só foi abolido no início dos anos 1990.'}},
  {k:'balance',
   zh:{t:'物资平衡表',b:'仿照苏联做法的计划工具：把钢材、水泥、煤炭等主要物资的“来源”（调入、生产、库存）与“用途”（基建、生产、储备）逐项列平，再按计划分配。游戏的平衡表即是简化版。'},
   en:{t:'Material balances',b:'A planning tool modelled on Soviet practice: for each key material such as steel, cement or coal, sources (allocations, output, stocks) were balanced item by item against uses (construction, production, reserves), and the material was then allocated by plan. The game\'s balance sheets are a simplified version.'},
   pt:{t:'Balanços materiais',b:'Instrumento de planeamento inspirado na prática soviética: para cada material essencial, como aço, cimento ou carvão, as origens (afetações, produção, existências) eram equilibradas item a item com os usos (construção, produção, reservas), e o material era depois distribuído segundo o plano. Os balanços do jogo são uma versão simplificada.'}},
  {k:'fyp',
   zh:{t:'五年计划',b:'第一个五年计划为 1953—1957 年，第二个为 1958—1962 年；1963—1965 年为国民经济调整时期，之后是第三（1966—1970）、第四（1971—1975）个五年计划。游戏为便于考核，把期次统一按每五年切分，起止年份与历史略有出入。'},
   en:{t:'Five-Year Plans',b:'The First Five-Year Plan ran from 1953 to 1957 and the Second from 1958 to 1962; 1963–1965 was a period of economic readjustment, followed by the Third (1966–1970) and Fourth (1971–1975) Plans. For scoring, the game cuts every period into five years, so its start and end years differ slightly from history.'},
   pt:{t:'Planos quinquenais',b:'O Primeiro Plano Quinquenal decorreu de 1953 a 1957 e o Segundo de 1958 a 1962; 1963–1965 foi um período de reajustamento económico, seguido do Terceiro (1966–1970) e do Quarto (1971–1975) planos. Para a avaliação, o jogo divide todos os períodos em cinco anos, pelo que as datas diferem ligeiramente da história.'}},
  {k:'bingtuan',
   zh:{t:'新疆生产建设兵团',b:'1954 年 10 月由驻疆部队集体转业组建，在玛纳斯河、塔里木河等流域屯垦，兴修水利、开办农场和工矿。游戏中兵团带来耕地、住房和持续的迁入人口。'},
   en:{t:'Xinjiang Production and Construction Corps',b:'Formed in October 1954 from army units stationed in Xinjiang that were demobilised en masse. It reclaimed land in basins such as the Manas and Tarim, built irrigation and set up farms, mines and factories. In the game the Corps brings farmland, housing and a steady flow of migrants.'},
   pt:{t:'Corpo de Produção e Construção de Xinjiang',b:'Criado em outubro de 1954 a partir de unidades do exército estacionadas em Xinjiang, desmobilizadas em bloco. Arroteou terras em bacias como as do Manas e do Tarim, construiu rega e criou quintas, minas e fábricas. No jogo, o Corpo traz terras, habitação e um fluxo contínuo de migrantes.'}},
  {k:'karez',
   zh:{t:'坎儿井',b:'吐鲁番、哈密一带的传统地下水利工程：从山前打一串竖井，在地下挖暗渠，把地下水引到绿洲，蒸发少、受旱情影响小。这就是游戏里东疆抗旱优势的来源。'},
   en:{t:'Karez wells',b:'A traditional underground irrigation system around Turpan and Hami: a line of vertical shafts is dug from the foothills and joined by a tunnel that carries groundwater to the oasis, losing little to evaporation and holding up in droughts. It is the source of the east\'s drought resistance in the game.'},
   pt:{t:'Poços karez',b:'Sistema tradicional de rega subterrânea na zona de Turpan e Hami: uma fila de poços verticais é escavada a partir do sopé das montanhas e ligada por um túnel que leva a água subterrânea até ao oásis, com pouca evaporação e boa resistência à seca. É a origem da resistência do Leste à seca no jogo.'}},
  {k:'karamay',
   zh:{t:'克拉玛依油田',b:'1955 年 10 月黑油山一号井喷出工业油流，1956 年确认为大油田，是新中国成立后发现的第一个大油田。游戏把出油事件放在 1956 年。'},
   en:{t:'Karamay oilfield',b:'Well No. 1 at Heiyoushan struck commercial oil in October 1955, and in 1956 the field was confirmed as a major oilfield, the first discovered after 1949. The game places the strike in 1956.'},
   pt:{t:'Campo petrolífero de Karamay',b:'O poço n.º 1 de Heiyoushan jorrou petróleo comercial em outubro de 1955 e, em 1956, o campo foi confirmado como grande jazida, a primeira descoberta depois de 1949. O jogo situa o acontecimento em 1956.'}},
  {k:'lanxin',
   zh:{t:'兰新铁路',b:'从兰州通往新疆的干线铁路，1952 年动工，1962 年铺轨到乌鲁木齐，1966 年全线正式运营。通车前新疆的物资主要靠汽车长途转运。'},
   en:{t:'Lanxin Railway',b:'The trunk line from Lanzhou to Xinjiang. Work began in 1952, track reached Ürümqi in 1962 and the whole line entered full service in 1966. Before it opened, goods reached Xinjiang mainly by long-haul truck.'},
   pt:{t:'Ferrovia Lanxin',b:'A linha principal de Lanzhou a Xinjiang. As obras começaram em 1952, a via chegou a Urumqi em 1962 e a linha entrou em pleno serviço em 1966. Até lá, as mercadorias chegavam a Xinjiang sobretudo de camião, em longas viagens.'}},
  {k:'sanxian',
   zh:{t:'三线建设',b:'1964 年起出于战备考虑，在西南、西北内陆大规模布局工业和交通。各省区需要调出物资和人员支援，游戏中的“三线建设调钢”事件即取材于此。'},
   en:{t:'Third Front construction',b:'From 1964, for war-preparedness reasons, industry and transport were built up on a large scale deep in the south-west and north-west. Provinces had to send materials and people to support it, which is the basis of the game\'s “Steel for the Third Front” event.'},
   pt:{t:'Construção da Terceira Frente',b:'A partir de 1964, por razões de preparação para a guerra, a indústria e os transportes foram desenvolvidos em grande escala no interior do sudoeste e do noroeste. As províncias tinham de enviar materiais e pessoas para a apoiar, o que inspira o evento “Aço para a Terceira Frente” do jogo.'}},
  {k:'tarim',

function techFactor(){ return clamp(0.75+0.3*S.tech/Math.max(0.1,techDemand()),0.75,1.08); }
function mechFactor(){ return 1+0.25*clamp(S.mach/Math.max(1,lv('farm')*3),0,1); }
function keepOf(r){ return tr(r,'logi')?0.99:r==='E'?0.98:(S.flags.road?0.97:0.94); }
const outLoss=r=>tr(r,'parochial')?1.12:1;
function produceRegion(r,weather){
 const g=REG[r], w=waterFactor(r), m=S.mods.prod*laborFactor();
 if(tr(r,'slow')&&weather<0.8) weather=1-(1-weather)*(1-0.3*mf(r));
 const morale=0.85+0.15*clamp(g.welfare/50,0,1);
 const grain=(g.base+lv('farm',r)*11)*w*weather*m*morale*mechFactor()*(tr(r,'grain')?1+0.05*mf(r):1)*(S.flags.tarim&&r==='S'&&S.year===1961?0.85:1);
 const meat=lv('herd',r)*1.2*m*(S.tmp.snowN&&r==='N'?0.6:1)*(weather<0.8?0.85:1);
 const cotton=(1+lv('cot',r)*3.2)*g.cotMul*w*(weather>0.8?1:0.7)*m*(S.tmp.cotS&&r==='S'?0.8:1);
 return {grain,cotton,w,meat};
}
function produceGlobal(){
 const m=S.mods.prod*laborFactor(), t=S.mods.tech*techFactor(), c=coalFactor();
 return {oil:lv('oil')*13*t*m, steel:lv('steel')*4.5*t*m*c, cem:lv('cem')*2*m*c, texCap:lv('tex')*4.2*m*c, cap:outCap(), coalS:coalSupply(), coalD:coalDemand(), cf:c, tf:t};
}
function fruitOut(){ return (3+Math.min(lv('irr','E'),8)*1.4+Math.min(lv('farm','E'),6)*0.5)*clamp(waterFactor('E'),0.5,1.2)*S.mods.prod; }
function woolOut(){ return lv('herd')*(S.flags.wool?0.4:0.25); }
function withPlan(fn){ const ap=g=>Object.entries(S.invest).forEach(([k,v])=>{ if(!v) return; const [id,r]=k.split(':'), x=sec(id); if(x.reg) x.lvl[r]+=g*v; else x.lvl+=g*v; }); ap(1); try{ return fn(); } finally{ ap(-1); } }
function totalBase(){ let g=0,c=0; R.forEach(r=>{const p=produceRegion(r,1);g+=p.grain;c+=p.cotton;}); return {grain:g,cotton:c,oil:Math.max(produceGlobal().oil,8)}; }

function startYear(){
 if(!S.officers) initOfficers();
 const c=centralIn(); S.in=c;
 S.res={steel:r1(c.steel+S.last.steel*0.8+S.carry.steel), cem:r1(c.cem+S.last.cem+S.carry.cem)};
 S.carry={steel:0,cem:0}; S.invest={}; S.move={N:0,S:0,E:0}; S.tmp={};
 setTask(); render(); save();
}
function setTask(){
 const G=produceGlobal(), tm=S.planBase?{steady:0.85,active:0.95,leap:1.05}[S.planBase.mode]:0.85;
 const oilT=Math.min(G.oil,G.cap)*tm, room=Math.max(0,G.cap-oilT)*0.8;
 S.task={oil:r1(oilT), cotton:r1(Math.min(totalBase().cotton*0.7,room)*tm)};
}
function moveSum(){ return S.move.N+S.move.S+S.move.E; }
function moveOut(){ return R.reduce((a,r)=>a+Math.max(0,-S.move[r]),0); }

function execute(){
 if(S.gameOver) return;
 const u=used();
 if(u.steel>S.res.steel+1e-9||u.cem>S.res.cem+1e-9){ toast('tOverMat'); return; }
 if(u.labor>0&&u.labor>laborFree()+1e-9){ toast('tOverLab'); return; }
 if(moveSum()!==0){ toast('tUnbal'); return; }
 const before={trust:S.trust,welfare:R.reduce((a,r)=>a+REG[r].welfare*REG[r].pop,0)/pop(),reg:Object.fromEntries(R.map(r=>[r,REG[r].welfare])),pop:pop()};
 const log=[]; S.lastInvest={...S.invest}; S.lastProj={...S.projOn};
 Object.entries(S.invest).forEach(([k,v])=>{ if(v>0){ const [id,r]=k.split(':'); const s=sec(id); if(s.reg) s.lvl[r]+=v; else s.lvl+=v; }});
 S.carry={steel:r1(Math.min(10,(S.res.steel-u.steel)*0.5)), cem:r1(Math.min(15,(S.res.cem-u.cem)*0.5))};
 PROJECTS.forEach(p=>{ if(S.projOn[p.id]){ S.proj[p.id]=(S.proj[p.id]||0)+1; if(S.proj[p.id]>=p.years&&!S.flags['done_'+p.id]){ S.flags['done_'+p.id]=1; p.apply(); S.trust=clamp(S.trust+4,0,100); log.push({k:'logProjDone',a:[p.id]}); } } }); S.projOn={};
 R.forEach(r=>{ const mv_=S.move[r]; REG[r].stock=Math.max(0,REG[r].stock+(mv_>0? mv_*keepOf(r) : mv_*outLoss(r))); });
 const G=produceGlobal(); let gTot=0,cTot=0,mTot=0; const wx=[]; const out={};
 R.forEach(r=>{ const g=REG[r], roll=S.dbgWx==='drought'?0:S.dbgWx==='good'?0.99:S.dbgWx==='normal'?0.5:Math.random(), dr=g.drought*D().drought; let weather=1,wt='';
  if(roll<dr){weather=0.72;wt='drought';} else if(roll<dr+0.1){weather=0.86;wt='frost';} else if(roll<dr+0.16){weather=0.88;wt='locust';} else if(roll>0.88){weather=1.08;wt='good';}
  if(wt==='locust'&&S.flags.noLocust>=S.year){ weather=1; wt=''; }
  let karez=0; if(r==='E'&&weather<1&&wt!=='locust'){ weather=1-(1-weather)*0.5; karez=1; }
  const p=produceRegion(r,weather); out[r]=p; gTot+=p.grain; cTot+=p.cotton; mTot+=p.meat; if(wt) wx.push({r,w:wt,k:karez}); });
 const meatPC=mTot*1000/pop();
 S.mach=r1(S.mach*0.94+lv('steel')*0.6*G.tf*G.cf); S.tech=r1(S.tech*0.97+lv('edu')*0.25+R.reduce((a,r)=>a+(tr(r,'tech')?0.3*mf(r):0),0));
 const repMul=S.report==='honest'?1:S.report==='mild'?1.15:1.4;
 const boast=R.reduce((a,r)=>a+(tr(r,'boast')?out[r].grain*0.1:0),0);
 const reported=gTot*repMul+boast; if(reported>gTot+0.01){ S.inflated+=reported-gTot; S.everInflated=true; }
 const quota=reported*((S.flags.highQuota?0.30:D().quota)+(S.flags.debt&&S.year<=1965?0.06:0))+(S.tmp.extraQuota||0);
 let worst=1, overflow=0; const sh=[];
 const cloth=Math.min(cTot*0.65+woolOut(),G.texCap), clothPC=cloth*0.15*1000/pop(); // 区内留用 15%
 R.forEach(r=>{ const g=REG[r], p=out[r]; const need=g.pop*NEED*S.ration, q=quota*(p.grain/gTot);
  let avail=g.stock+p.grain-q, got=S.ration;
  if(avail<need){ got=S.ration*Math.max(0.5,avail/need); avail=0; sh.push({r,p:r0(got/S.ration*100)}); } else avail-=need;
  const capS=Math.max(20,g.pop*NEED); if(avail>capS) overflow+=avail-capS; g.stock=clamp(avail,0,capS); g.ration=got; worst=Math.min(worst,got);
  const crowd=clamp(g.pop/(g.cap0+lv('hous',r)*45),0,2); const food=got>=1?42+(got-1)*40:42*Math.pow(clamp((got-0.5)/0.5,0,1),1.3), fs=clamp(got,0.6,1), fruitBonus=r==='E'?clamp(fruitOut()*0.3*1000/g.pop/25,0,1)*7:0;
  const tgt=16+fruitBonus+(tr(r,'welfare')?3*mf(r):0)-(tr(r,'harsh')?5:0)+food+fs*(9*clamp(clothPC/1,0,1)+6*clamp(meatPC/8,0,1)+Math.min(lv('hous',r),6)*1.8+Math.min(lv('edu',r),6)*2)-8*Math.max(0,crowd-1)-S.mods.unrest-(g.tmpWelfare||0);
  g.tmpWelfare=0;
  g.welfare=clamp(g.welfare+(tgt-g.welfare)*0.35,0,100);
  g.hist.push({year:S.year,grain:p.grain,cotton:p.cotton,w:p.w,welfare:g.welfare});
 });
 const fruit=fruitOut(), shipFruit=Math.min(fruit*0.7,G.cap*0.15);
 const capLeft=G.cap-shipFruit; const shipOil=Math.min(G.oil,capLeft), shipCot=Math.min(cTot*0.7,Math.max(0,capLeft-shipOil)*0.8);
 const hitO=S.task.oil>0?Math.min(1,shipOil/S.task.oil):1, hitC=S.task.cotton>0?Math.min(1,shipCot/S.task.cotton):1;
 S.taskHit=(hitO+hitC)/2;
 const fruitGain=Math.min(1.2,shipFruit/12); S.fruitShip=shipFruit;
 let dT=D().drift; const gain=x=>x*Math.max(0.25,1-S.trust/110); if(repMul>1) dT+=gain(repMul>1.2?6:3);
 const shortW=R.reduce((x,r)=>x+REG[r].pop*Math.max(0,1-REG[r].ration/S.ration),0)/pop(); if(shortW>0.002) dT-=0.5+16*shortW;
 dT+=gain(fruitGain); S.carry.cem=r1(S.carry.cem+shipFruit*0.15); S.carry.steel=r1(S.carry.steel+shipFruit*0.05);
 if(overflow>0){ dT+=gain(Math.min(3,overflow/40)); } if(S.taskHit>=0.95) dT+=gain(2.5); else if(S.taskHit<0.8) dT-=3; dT=r1(dT);
 if(S.inflated>0 && Math.random()<Math.min(0.45,0.06+S.inflated/800)){ const pen=r0(Math.min(35,8+S.inflated/12)); dT-=pen; log.push({k:'logAudit',a:[r1(S.inflated),pen]}); S.inflated=0; }
 S.trust=clamp(S.trust+dT,0,100);
 R.forEach(r=>{ const g=REG[r]; const mig=g.pop*0.003+Math.min(lv('hous',r),8)*1.2+(g.welfare>55?g.pop*0.002:0)+(S.flags.bingtuan&&r==='N'?4:S.flags.bingtuan&&r==='S'?1.2:0);
  g.pop=r1(g.pop*(g.ration<0.7?0.99:g.ration<0.85?1.004:1.017)+(g.ration<0.85?mig*0.3:mig)); });
 R.forEach(r=>{ if(tr(r,'ill')&&Math.random()<0.1){ const old=S.officers[r]; S.retired=S.retired||[]; S.retired.push(old.n); const o=newOfficer(serving()); S.officers[r]=o; log.push({k:'logIll',a:[r,old.n,o.n]}); } });
 const welfare=R.reduce((a,r)=>a+REG[r].welfare*REG[r].pop,0)/pop();
 S.hist.push({year:S.year,grain:gTot,cotton:cTot,oil:G.oil,steel:G.steel,cloth,welfare,trust:S.trust,pop:pop()});
 S.last={oil:G.oil,cotton:cTot,steel:G.steel,cloth,cem:G.cem,meat:mTot,coalS:G.coalS,coalD:G.coalD};
 S.overflow=overflow;
 const yl={wx,g:r1(gTot),gN:r1(out.N.grain),gS:r1(out.S.grain),gE:r1(out.E.grain),rep:r1(reported),q:r1(quota),fr:r1(shipFruit),of:r1(overflow),sh,
  so:r1(shipOil),to:S.task.oil,sc:r1(shipCot),tc:S.task.cotton,th:r0(S.taskHit*100),st:r1(G.steel),ce:r1(G.cem),mp:r1(meatPC),cf:r0(G.cf*100),lf:r0(laborFactor()*100)};
 const brief={year:S.year,wx,gTot,quota,sh,clothPC,meatPC,G,dT,before,welfare,log:log.slice()};
 addLog(S.year,'logYear',yl); log.forEach(l=>addLog(S.year,l.k,...l.a));
 Object.keys(S.mods.until).forEach(k=>{ if(S.mods.until[k]<=S.year){ delete S.mods.until[k]; if(k==='prod')S.mods.prod=1; if(k==='tech')S.mods.tech=1; if(k==='unrest')S.mods.unrest=0; if(k==='highQuota')delete S.flags.highQuota; }});
 if((S.year-1952)%5===0 && S.planBase) evaluatePlan();
 checkMedals();
 const bad=R.find(r=>REG[r].welfare<8);
 S.dbgWx=null;
 if(!S.dbgGod){ if(bad) return endGame({k:'endRegion',a:[bad]});
 if(welfare<15) return endGame({k:'endWelfare',a:[]});
 if(S.trust<10) return endGame({k:'endTrust',a:[]}); }
 S.year++;
 if(S.year>1977) return endGame(null);
 startYear(); pulse();
 showBrief(brief);
}
function afterBrief(){
 const ev=EVENTS.find(e=>e.year===S.year);
 if(ev){ showEvent(ev.year,ev.fx,S.year); return; }
 if((S.year-1953)%5===0){ showPlanChoice(); return; }
 if(Math.random()<D().evt){ const pool=RANDOM.filter(e=>!S.fired.includes(e.id)&&(!e.when||e.when())); if(pool.length){ const e=pick(pool); S.fired.push(e.id); showEvent(e.id,e.fx,S.year); } }
}

function evaluatePlan(){
 const h=S.hist.slice(-5), out=h.reduce((a,x)=>({grain:a.grain+x.grain,cotton:a.cotton+x.cotton,oil:a.oil+x.oil}),{grain:0,cotton:0,oil:0});
 const t=S.planBase.targets; let hit=0; const lines=[];
 for(const k of ['grain','cotton','oil']){ const ok=out[k]>=t[k]*0.97; if(ok)hit++; lines.push({k,o:r0(out[k]),t:r0(t[k]),ok}); }
 const bonus=S.planBase.mode==='leap'?1.6:S.planBase.mode==='active'?1.2:1;
 const dT=hit===3?r0(12*bonus):hit===2?3:hit===1?-4:r0(-8*bonus);
 S.trust=clamp(S.trust+dT,0,100); let amt=0; if(hit===3){ amt=r1(6*bonus); S.carry.steel+=amt; S.carry.cem+=amt; S.plansHit++; }
 addLog(S.year,'logPlanEval',S.planBase.y,lines,dT,amt);
 S.planBase=null;
}
